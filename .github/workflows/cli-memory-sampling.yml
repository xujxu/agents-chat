name: CLI memory sampling
on:
  push:
    branches: [ops/cli-memory-sampling]
    paths: [ops/cpg/**, .github/workflows/cli-memory-sampling.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check opt-in preload compatibility with the official standalone CLI
        run: |
          mkdir -p "$RUNNER_TEMP/copilot-runtime"
          cd "$RUNNER_TEMP/copilot-runtime"
          curl --fail --silent --show-error --location -O https://github.com/github/copilot-cli/releases/download/v1.0.88/copilot-linux-x64.tar.gz
          curl --fail --silent --show-error --location -O https://github.com/github/copilot-cli/releases/download/v1.0.88/SHA256SUMS.txt
          grep ' copilot-linux-x64.tar.gz$' SHA256SUMS.txt | sha256sum --check -
          tar -xzf copilot-linux-x64.tar.gz
          python3 "$GITHUB_WORKSPACE/ops/cpg/test_runtime_compatibility.py" ./copilot
      - name: Check real internal telemetry, disconnects, and numeric overhead
        run: |
          node ops/cpg/test_preload_bounds.cjs
          python3 ops/cpg/test_runtime_preload.py "$RUNNER_TEMP/copilot-runtime/copilot"
  guard:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify launcher isolation and upgrade with live tasks in legacy-cgroup VM
        run: bash ops/cpg/ci-vm.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guard-vm-diagnostics
          path: ${{ runner.temp }}/cpg-vm/serial.log
          retention-days: 3
  sampler:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test read-only sampler using synthetic proc and cgroup fixtures
        run: |
          docker run --rm -v "$PWD/ops/cpg:/source:ro" ubuntu:20.04 bash -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3
            cd /source
            PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v test_memory_sampler.py test_memory_sampler_service.py test_continuous_sampler.py test_memory_sampler_metrics.py test_memory_sampler_runtime.py test_cpg.py
          '
      - name: Verify service resource limits and lifecycle in legacy-cgroup VM
        run: bash ops/cpg/ci-vm.sh memory_sampler_integration.py
      - name: Package standalone diagnostic tool
        run: |
          mkdir artifact
          cp ops/cpg/memory_sampler.py ops/cpg/memory_sampler_incident.py ops/cpg/memory_sampler_metrics.py ops/cpg/memory_sampler_runtime.py ops/cpg/memory_sampler_launch.py ops/cpg/memory_sampler_service.py ops/cpg/memory_sampler_preload.cjs ops/cpg/cpg_common.py ops/cpg/cpg_launcher.py ops/cpg/cpg_admin.py ops/cpg/MEMORY-SAMPLING.txt ops/cpg/README.md artifact/
          printf '%s\n' "$GITHUB_SHA" > artifact/revision.txt
          (cd artifact && sha256sum *.py *.cjs MEMORY-SAMPLING.txt README.md revision.txt > SHA256SUMS && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: cli-memory-sampler-${{ github.sha }}
          path: artifact/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sampler-service-vm-diagnostics
          path: |
            ${{ runner.temp }}/cpg-vm/serial.log
            ${{ runner.temp }}/cpg-vm/install.log
            ${{ runner.temp }}/cpg-vm/guestfs.log
          if-no-files-found: ignore
          retention-days: 3
