name: Deployment lifecycle

on:
  push:
    branches: [feat/deployment-backup]
    paths:
      - 'scripts/deploy*'
      - 'scripts/update*'
      - 'scripts/restore*'
      - 'scripts/deployment/**'
      - 'scripts/start.ps1'
      - 'scripts/service-watchdog.ps1'
      - 'scripts/install-scheduled-task.ps1'
      - 'tests/deployment-*'
      - '.github/workflows/deployment-lifecycle.yml'
  pull_request:
    paths:
      - 'scripts/deploy*'
      - 'scripts/update*'
      - 'scripts/restore*'
      - 'scripts/deployment/**'
      - 'scripts/start.ps1'
      - 'scripts/service-watchdog.ps1'
      - 'scripts/install-scheduled-task.ps1'
      - 'tests/deployment-*'
      - '.github/workflows/deployment-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-lifecycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-first-build:
    name: Native Linux first-install build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Create isolated first-install runtime account
        id: first_runtime_account
        run: sudo useradd --create-home --user-group --shell /usr/sbin/nologin agents-chat-test
      - name: Verify fresh build, activation and retirement recovery
        run: |
          sudo git config --system --add safe.directory "$GITHUB_WORKSPACE"
          sudo env DEPLOYMENT_TEST_REAL_FIRST_BUILD=1 "$(command -v node)" --test tests/deployment-linux-first-build.test.mjs tests/deployment-linux-first-unit.test.mjs tests/deployment-linux-first-recovery.test.mjs
      - name: Remove isolated first-install runtime account
        if: always() && steps.first_runtime_account.outcome == 'success'
        run: sudo userdel --remove agents-chat-test

  linux-deployment:
    name: Native Linux deployment (${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scenario: [synthetic, current, historical, rebuild, command, inplace, fresh, first-failure, inactive, failed]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update running fixture into actual application with owned source build
        if: matrix.scenario != 'fresh' && matrix.scenario != 'first-failure'
        run: |
          sudo git config --system --add safe.directory "$GITHUB_WORKSPACE"
          pattern='scenario=${{ matrix.scenario }}'
          if [ '${{ matrix.scenario }}' = synthetic ]; then
            pattern="$pattern|^native deployment (refuses|restores prior|retains)"
          fi
          sudo env DEPLOYMENT_TEST_REAL_DEPLOYMENT=1 "$(command -v node)" --test "--test-name-pattern=$pattern" tests/deployment-linux-deployment.test.mjs
      - name: Create isolated public-lifecycle runtime account
        if: matrix.scenario == 'fresh' || matrix.scenario == 'first-failure'
        id: fresh_runtime_account
        run: sudo useradd --create-home --user-group --shell /usr/sbin/nologin agents-chat-test
      - name: Verify public first install, two updates and saved restoration
        if: matrix.scenario == 'fresh'
        run: |
          sudo git config --system --add safe.directory "$GITHUB_WORKSPACE"
          sudo env DEPLOYMENT_TEST_REAL_FIRST_LIFECYCLE=1 "$(command -v node)" --test tests/deployment-linux-first-lifecycle.test.mjs
      - name: Verify public first-install failure and no-backup recovery refusal
        if: matrix.scenario == 'first-failure'
        run: |
          sudo git config --system --add safe.directory "$GITHUB_WORKSPACE"
          sudo env DEPLOYMENT_TEST_REAL_FIRST_FAILURE=1 "$(command -v node)" --test tests/deployment-linux-first-failure.test.mjs
      - name: Remove isolated public-lifecycle runtime account
        if: always() && steps.fresh_runtime_account.outcome == 'success'
        run: sudo userdel --remove agents-chat-test

  application-build:
    name: Owned application build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build actual source with Linux native ownership
        if: runner.os == 'Linux'
        run: |
          sudo git config --system --add safe.directory "$GITHUB_WORKSPACE"
          sudo env DEPLOYMENT_TEST_REAL_BUILD=1 "DEPLOYMENT_TEST_GIT=$(command -v git)" "DEPLOYMENT_TEST_NPM_CLI=$(readlink -f "$(command -v npm)")" "$(command -v node)" --test --test-name-pattern="^actual application source installs and builds" tests/deployment-native-operation.test.mjs
      - name: Build actual source with Windows native ownership
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:DEPLOYMENT_TEST_REAL_BUILD = '1'
          $env:DEPLOYMENT_TEST_PWSH = (Get-Command pwsh).Source
          $env:DEPLOYMENT_TEST_GIT = (Get-Command git).Source
          $env:DEPLOYMENT_TEST_NPM_CLI = Join-Path (Split-Path (Get-Command node).Source) 'node_modules/npm/bin/npm-cli.js'
          node --test --test-name-pattern="^actual application source installs and builds" tests/deployment-native-operation.test.mjs
          exit $LASTEXITCODE

  database-admission:
    name: Database admission (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Inspect actual historical databases without initialization
        run: node --test tests/deployment-database-compatibility.test.mjs tests/deployment-target-compatibility.test.mjs tests/deployment-data-content.test.mjs tests/deployment-dotenv-compatibility.test.mjs tests/deployment-database-command.test.mjs tests/deployment-legacy-configuration.test.mjs

  linux-data-admission:
    name: Native Linux database admission
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Inspect databases under the installed account and settle blocked bindings
        run: |
          sudo git config --system --add safe.directory "$GITHUB_WORKSPACE"
          sudo "$(command -v node)" --test tests/deployment-linux-data-worker.test.mjs tests/deployment-linux-compatibility.test.mjs tests/deployment-linux-snapshot.test.mjs tests/deployment-linux-readiness.test.mjs tests/deployment-linux-restore.test.mjs tests/deployment-linux-cold-restore.test.mjs tests/deployment-linux-acceptance.test.mjs

  contracts:
    name: Contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run behavioral contracts
        run: >-
          node --test
          tests/deployment-state.test.mjs
          tests/deployment-cli.test.mjs
          tests/deployment-snapshot.test.mjs
          tests/deployment-snapshot-scope.test.mjs
          tests/deployment-snapshot-external.test.mjs
          tests/deployment-transaction.test.mjs
          tests/deployment-restore-transaction.test.mjs
          tests/deployment-restore-project.test.mjs
          tests/deployment-restore-external.test.mjs
          tests/deployment-source.test.mjs
          tests/deployment-npm-command.test.mjs
          tests/deployment-build-artifacts.test.mjs
          tests/deployment-receipt.test.mjs
          tests/deployment-git-metadata.test.mjs
          tests/deployment-git-objects.test.mjs
          tests/deployment-update-policy.test.mjs
          tests/deployment-stage-runner.test.mjs
          tests/deployment-worker-errors.test.mjs
          tests/deployment-owned-worker.test.mjs
          tests/deployment-worker-journal.test.mjs
          tests/deployment-saved-worker.test.mjs
          tests/deployment-worker-wire.test.mjs
          tests/deployment-worker-operation.test.mjs
          tests/deployment-worker-retirement.test.mjs
          tests/deployment-retirement-recovery.test.mjs
          tests/deployment-configuration-files.test.mjs
          tests/deployment-snapshot-configuration.test.mjs
          tests/deployment-runtime-version.test.mjs
          tests/deployment-diagnostics.test.mjs
          tests/deployment-cold-activation-state.test.mjs
      - name: Probe Windows cold retirement stability
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            Write-Host "Cold retirement diagnostic sample $attempt"
            node --test --test-name-pattern="independent saved recovery finishes|cold worker retirement preserves" tests/deployment-retirement-recovery.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  linux-native:
    name: Native Linux worker domain
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Characterize retained cgroup observation
        run: sudo "$(command -v node)" tests/deployment-linux-domain-probe.mjs
      - name: Retain installed unit source identities
        run: sudo "$(command -v node)" --test tests/deployment-linux-service-sources.test.mjs
      - name: Observe initially inactive and failed service identities
        run: sudo "$(command -v node)" --test tests/deployment-linux-inactive-service.test.mjs
      - name: Maintain initially stopped service authority
        run: sudo "$(command -v node)" --test tests/deployment-linux-inactive-maintenance.test.mjs
      - name: Restore initially stopped services after controller death
        run: sudo "$(command -v node)" --test tests/deployment-linux-inactive-cold-restore.test.mjs
      - name: Inspect configuration without a running service process
        run: sudo "$(command -v node)" --test tests/deployment-linux-inactive-configuration.test.mjs
      - name: Discover retained inactive runtime executables
        run: sudo "$(command -v node)" --test tests/deployment-linux-inactive-discovery.test.mjs
      - name: Restore actual Git commit-graph layouts with privileged file ownership
        run: sudo "$(command -v node)" --test tests/deployment-git-objects.test.mjs
      - name: Exercise actual saved-engine systemd workers
        run: sudo env "DEPLOYMENT_TEST_GIT=$(command -v git)" "DEPLOYMENT_TEST_NPM_CLI=$(readlink -f "$(command -v npm)")" "$(command -v node)" --test tests/deployment-linux-worker.test.mjs tests/deployment-native-operation.test.mjs tests/deployment-linux-runtime.test.mjs tests/deployment-linux-service.test.mjs tests/deployment-linux-configuration.test.mjs tests/deployment-controller-capture.test.mjs tests/deployment-linux-restore-invocation.test.mjs tests/deployment-recovery-engine-retention.test.mjs tests/deployment-linux-first-install.test.mjs

  linux-service-recovery:
    name: Native Linux service recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Recover interrupted actual service retirement
        run: sudo "$(command -v node)" --test tests/deployment-recovery-admission.test.mjs tests/deployment-linux-service-recovery.test.mjs tests/deployment-linux-cold-service.test.mjs

  linux-worker-handoff:
    name: Native Linux retirement handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Recover interrupted live worker retirement
        run: sudo "$(command -v node)" --test tests/deployment-linux-worker-handoff.test.mjs

  windows-native:
    name: Native Windows Job ownership
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exercise explicit Job and gated launcher
        shell: pwsh
        run: ./tests/deployment-windows-job.ps1
      - name: Exercise saved Windows coordinator and receipts
        shell: pwsh
        run: |
          $env:DEPLOYMENT_TEST_PWSH = (Get-Command pwsh).Source
          $env:DEPLOYMENT_TEST_NPM_CLI = Join-Path (Split-Path (Get-Command node).Source) 'node_modules/npm/bin/npm-cli.js'
          $env:DEPLOYMENT_TEST_GIT = (Get-Command git).Source
          node --test tests/deployment-windows-worker.test.mjs tests/deployment-native-operation.test.mjs

  windows-task-options:
    name: Native Windows task options
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify portable Scheduled Task and child parameters with PowerShell 5.1
        shell: powershell
        run: ./tests/deployment-windows-task-options.ps1
      - name: Preserve existing deployment and startup regressions
        shell: powershell
        run: |
          node tests/deploy-script-scheduled-task.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/start-script-healthcheck.test.js
          exit $LASTEXITCODE
      - name: Observe real task definitions without adopting process ownership
        shell: powershell
        run: node --test tests/deployment-windows-task-inspection.test.mjs
      - name: Bind runtime control transport to the actual Scheduled Task owner
        shell: pwsh
        run: ./tests/deployment-windows-runtime-pipe.ps1
      - name: Retain original task-side runtime Job across controller connections
        shell: pwsh
        run: ./tests/deployment-windows-runtime-domain.ps1
      - name: Retain private runtime configuration files and permissions
        shell: pwsh
        run: ./tests/deployment-windows-private-file.ps1
      - name: Run installed private runtime host under an actual Scheduled Task
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1
      - name: Refuse changed installed runtime configuration and settle original ownership
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario configuration-change
