name: Deployment lifecycle

on:
  push:
    branches: [feat/deployment-backup]
    paths:
      - 'scripts/deploy*'
      - 'scripts/update*'
      - 'scripts/restore*'
      - 'scripts/deployment/**'
      - 'scripts/start.ps1'
      - 'scripts/service-watchdog.ps1'
      - 'scripts/install-scheduled-task.ps1'
      - 'tests/deployment-*'
      - 'tests/Windows*.cs'
      - '.github/workflows/deployment-lifecycle.yml'
  pull_request:
    paths:
      - 'scripts/deploy*'
      - 'scripts/update*'
      - 'scripts/restore*'
      - 'scripts/deployment/**'
      - 'scripts/start.ps1'
      - 'scripts/service-watchdog.ps1'
      - 'scripts/install-scheduled-task.ps1'
      - 'tests/deployment-*'
      - 'tests/Windows*.cs'
      - '.github/workflows/deployment-lifecycle.yml'
  workflow_dispatch:
    inputs:
      windows_restore_only:
        description: Run only native Windows snapshot and restoration contracts
        type: boolean
        default: false
      windows_contracts_only:
        description: With windows_restore_only, select the complete Windows Contracts job instead
        type: boolean
        default: false
      windows_application_only:
        description: Run only the real Windows application lifecycle (takes precedence)
        type: boolean
        default: false
      windows_live_only:
        description: With windows_application_only, omit the unrelated first-install suites
        type: boolean
        default: false
      windows_failed_application_only:
        description: With application/live flags, run only the actual failed-update application phase
        type: boolean
        default: false
      windows_commands_only:
        description: With windows_application_only, run native command contracts without application builds
        type: boolean
        default: false
      windows_history_only:
        description: With application/live/commands flags and failed scenario, run one actual stopped-history recovery fixture
        type: boolean
        default: false
      windows_restore_scenario:
        description: With the paired Windows live selector, choose the actual saved restore scenario
        type: choice
        options: [complete, cancelled, failed, crash, cold-receipt, cold-state, cold-completion, cold-start, cold-startup, cold-launch, cold-enabled, cold-requested, cold-registered, cold-unlaunched, offline]
        default: complete
      windows_receipt_only:
        description: With both Windows command flags, select first-receipt integration and saved dependency tests
        type: boolean
        default: false
      windows_cold_started_only:
        description: With Windows application/live/command flags, run only earlier-startup native recovery
        type: boolean
        default: false
      windows_cold_startup_step:
        description: Earlier-startup native interruption boundary
        type: choice
        options: [started, requested, registered, enabled]
        default: started
      windows_first_application_only:
        description: With both Windows command flags, run only the actual first-application core
        type: boolean
        default: false
      windows_first_public_only:
        description: With first-application-only and both command flags, select only public first NoTunnel deployment
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deployment-lifecycle-${{ github.ref }}${{ inputs.windows_first_application_only && '-windows-first-application' || inputs.windows_application_only && inputs.windows_live_only && '-windows-live' || inputs.windows_application_only && inputs.windows_commands_only && inputs.windows_receipt_only && '-windows-receipts' || inputs.windows_application_only && inputs.windows_commands_only && '-windows-commands' || inputs.windows_application_only && '-windows-application' || inputs.windows_restore_only && '-windows-restore' || '' }}${{ inputs.windows_first_public_only && '-public-first' || '' }}${{ inputs.windows_application_only && inputs.windows_live_only && inputs.windows_commands_only && '-commands' || '' }}${{ inputs.windows_cold_started_only && format('-cold-{0}', inputs.windows_cold_startup_step || 'started') || '' }}${{ inputs.windows_restore_only && inputs.windows_contracts_only && '-contracts' || '' }}${{ inputs.windows_application_only && inputs.windows_live_only && inputs.windows_failed_application_only && '-failed-application-only' || '' }}${{ inputs.windows_application_only && inputs.windows_live_only && inputs.windows_commands_only && inputs.windows_history_only && inputs.windows_restore_scenario == 'failed' && '-history-only' || '' }}
  cancel-in-progress: false

jobs:
  linux-first-build:
    if: ${{ !inputs.windows_restore_only && !inputs.windows_application_only }}
    name: Native Linux first-install build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Create isolated first-install runtime account
        id: first_runtime_account
        run: sudo useradd --create-home --user-group --shell /usr/sbin/nologin agents-chat-test
      - name: Verify fresh build, activation and retirement recovery
        run: |
          sudo git config --system --add safe.directory "$GITHUB_WORKSPACE"
          sudo env DEPLOYMENT_TEST_REAL_FIRST_BUILD=1 "$(command -v node)" --test tests/deployment-linux-first-build.test.mjs tests/deployment-linux-first-unit.test.mjs tests/deployment-linux-first-recovery.test.mjs
      - name: Remove isolated first-install runtime account
        if: always() && steps.first_runtime_account.outcome == 'success'
        run: sudo userdel --remove agents-chat-test

  linux-deployment:
    if: ${{ !inputs.windows_restore_only && !inputs.windows_application_only }}
    name: Native Linux deployment (${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scenario: [synthetic, current, historical, rebuild, command, inplace, fresh, first-failure, inactive, failed]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update running fixture into actual application with owned source build
        if: matrix.scenario != 'fresh' && matrix.scenario != 'first-failure'
        run: |
          sudo git config --system --add safe.directory "$GITHUB_WORKSPACE"
          pattern='scenario=${{ matrix.scenario }}'
          if [ '${{ matrix.scenario }}' = synthetic ]; then
            pattern="$pattern|^native deployment (refuses|restores prior|retains)"
          fi
          sudo env DEPLOYMENT_TEST_REAL_DEPLOYMENT=1 "$(command -v node)" --test "--test-name-pattern=$pattern" tests/deployment-linux-deployment.test.mjs
      - name: Create isolated public-lifecycle runtime account
        if: matrix.scenario == 'fresh' || matrix.scenario == 'first-failure'
        id: fresh_runtime_account
        run: sudo useradd --create-home --user-group --shell /usr/sbin/nologin agents-chat-test
      - name: Verify public first install, two updates and saved restoration
        if: matrix.scenario == 'fresh'
        run: |
          sudo git config --system --add safe.directory "$GITHUB_WORKSPACE"
          sudo env DEPLOYMENT_TEST_REAL_FIRST_LIFECYCLE=1 "$(command -v node)" --test tests/deployment-linux-first-lifecycle.test.mjs
      - name: Verify public first-install failure and no-backup recovery refusal
        if: matrix.scenario == 'first-failure'
        run: |
          sudo git config --system --add safe.directory "$GITHUB_WORKSPACE"
          sudo env DEPLOYMENT_TEST_REAL_FIRST_FAILURE=1 "$(command -v node)" --test tests/deployment-linux-first-failure.test.mjs
      - name: Remove isolated public-lifecycle runtime account
        if: always() && steps.fresh_runtime_account.outcome == 'success'
        run: sudo userdel --remove agents-chat-test

  application-build:
    if: ${{ (inputs.windows_application_only || !inputs.windows_restore_only) && !(inputs.windows_application_only && (inputs.windows_commands_only || inputs.windows_live_only)) }}
    name: Owned application build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.windows_application_only && '["windows-2022"]' || '["ubuntu-24.04","windows-2022"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build actual source with Linux native ownership
        if: runner.os == 'Linux'
        run: |
          sudo git config --system --add safe.directory "$GITHUB_WORKSPACE"
          sudo env DEPLOYMENT_TEST_REAL_BUILD=1 "DEPLOYMENT_TEST_GIT=$(command -v git)" "DEPLOYMENT_TEST_NPM_CLI=$(readlink -f "$(command -v npm)")" "$(command -v node)" --test --test-name-pattern="^actual application source installs and builds" tests/deployment-native-operation.test.mjs
      - name: Build actual source with Windows native ownership
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:DEPLOYMENT_TEST_REAL_BUILD = '1'
          $env:DEPLOYMENT_TEST_PWSH = (Get-Command pwsh).Source
          $env:DEPLOYMENT_TEST_GIT = (Get-Command git).Source
          $env:DEPLOYMENT_TEST_NPM_CLI = Join-Path (Split-Path (Get-Command node).Source) 'node_modules/npm/bin/npm-cli.js'
          ./tests/deployment-windows-private-tests.ps1 -Tests @('tests/deployment-native-operation.test.mjs') -NamePattern '^actual application source installs and builds'

  windows-cold-started-recovery:
    if: ${{ (!inputs.windows_application_only && !inputs.windows_restore_only) || (inputs.windows_application_only && inputs.windows_live_only && inputs.windows_commands_only && (inputs.windows_restore_scenario == 'complete' || inputs.windows_cold_started_only)) }}
    name: Native Windows earlier-startup recovery (${{ inputs.windows_cold_startup_step || 'started' }})
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify original enabled task policy definitions
        shell: pwsh
        run: ./tests/deployment-windows-cold-policy-definition.ps1
      - name: Verify original startup recovery and archival
        if: ${{ inputs.windows_restore_scenario != 'failed' }}
        shell: pwsh
        env:
          COLD_STARTUP_STEP: ${{ inputs.windows_cold_startup_step || 'started' }}
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-restore -StoppedProof -ColdStartupCrash -ColdStartupStep $env:COLD_STARTUP_STEP

  windows-stopped-history:
    if: ${{ inputs.windows_application_only && inputs.windows_live_only && inputs.windows_commands_only && inputs.windows_history_only && inputs.windows_restore_scenario == 'failed' }}
    name: Native Windows stopped-history archival and saved takeover
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify actual stopped-history deletion, finalization and saved-entry takeover
        shell: pwsh
        run: |
          $env:DEPLOYMENT_TEST_PWSH = (Get-Command pwsh).Source
          & (Get-Command pwsh).Source -NoProfile -NonInteractive -File ./tests/deployment-windows-runtime-host.ps1 -Scenario task-inhibition -InactiveCompletionRecovery -InactiveCompletionRecoveryStep release-requested -ExternalInactiveRuntime -InactiveRollbackCrashStep task-restore-requested | Tee-Object -Variable historyOutput
          if ($LASTEXITCODE -ne 0) { throw 'Stopped-history native archival or saved-entry takeover failed.' }
          foreach ($receipt in @(
            'PASS: actual history writer death preserves its archived prefix and a distinct fresh actor completes exact native archival',
            'PASS: death after final intent archival retains sealed evidence for a distinct fresh read-only actor',
            'PASS: the exact verified saved entry resumes stopped history archival after actual actor death',
            'PASS: completion publisher death preserves original receipt bytes and identity for a distinct fresh actor'
          )) {
            if ($historyOutput -cnotcontains $receipt) { throw "Missing stopped-history acceptance receipt: $receipt" }
          }

  windows-live-deployment:
    if: ${{ (inputs.windows_application_only || !inputs.windows_restore_only) && !inputs.windows_first_application_only && !(inputs.windows_application_only && inputs.windows_live_only && inputs.windows_failed_application_only) && !(inputs.windows_application_only && inputs.windows_live_only && inputs.windows_commands_only && inputs.windows_cold_started_only) && !(inputs.windows_application_only && inputs.windows_live_only && inputs.windows_commands_only && inputs.windows_history_only && inputs.windows_restore_scenario == 'failed') }}
    name: ${{ matrix.scenario == 'cancelled' && 'Actual Windows restore cancellation' || matrix.scenario == 'failed' && 'Actual Windows restore failure' || matrix.scenario == 'crashed' && 'Actual Windows restore crash' || matrix.scenario == 'copy-crashed' && 'Actual Windows file-copy restore crash' || matrix.scenario == 'offline' && 'Actual Windows restore egress denial' || 'Actual Windows live deployment' }}
    runs-on: windows-2022
    timeout-minutes: ${{ inputs.windows_application_only && inputs.windows_commands_only && ((matrix.scenario == 'complete' || contains(fromJSON('["cold-startup","cold-launch","cold-enabled","cold-requested","cold-registered","cold-unlaunched"]'), inputs.windows_restore_scenario)) && 185 || matrix.scenario == 'copy-crashed' && 140 || 115) || (matrix.scenario == 'complete' || contains(fromJSON('["cold-startup","cold-launch","cold-enabled","cold-requested","cold-registered","cold-unlaunched"]'), inputs.windows_restore_scenario)) && 300 || matrix.scenario == 'copy-crashed' && 255 || 230 }}
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(inputs.windows_restore_scenario == 'cancelled' && '["cancelled"]' || inputs.windows_restore_scenario == 'failed' && '["failed"]' || inputs.windows_restore_scenario == 'crash' && '["crashed","copy-crashed"]' || contains(fromJSON('["cold-receipt","cold-state","cold-completion","cold-start","cold-startup","cold-launch","cold-enabled","cold-requested","cold-registered","cold-unlaunched"]'), inputs.windows_restore_scenario) && '["copy-crashed"]' || inputs.windows_restore_scenario == 'offline' && '["offline"]' || inputs.windows_application_only && '["complete"]' || '["complete","cancelled","failed","crashed","copy-crashed","offline"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify scoped restore egress denial and cleanup
        if: matrix.scenario == 'offline'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          . ./tests/deployment-windows-restore-egress.ps1
          $guard = $null
          try {
            $guard = Enable-WindowsRestoreEgressBlock -Node (Get-Command node).Source -Pwsh (Get-Command pwsh).Source -Git (Get-Command git).Source
          } finally {
            if ($guard) { Disable-WindowsRestoreEgressBlock $guard }
          }
          & (Get-Command node).Source ./tests/deployment-windows-egress-probe.mjs allowed $guard.Address
          if ($LASTEXITCODE -ne 0) { throw 'External connectivity was not restored after firewall fixture cleanup.' }
      - name: Verify saved worker dependencies and transport failure contracts
        shell: pwsh
        run: |
          ./tests/deployment-windows-private-tests.ps1 -Tests @('tests/deployment-saved-worker.test.mjs', 'tests/deployment-worker-wire.test.mjs')
          if ($LASTEXITCODE -ne 0) { throw 'Saved worker dependency or transport failure contracts failed.' }
      - name: Verify native Windows command contracts
        shell: pwsh
        run: |
          $env:DEPLOYMENT_TEST_PWSH = (Get-Command pwsh).Source
          node --test tests/deployment-diagnostics.test.mjs tests/deployment-process-identity.test.mjs tests/deployment-windows-command.test.mjs tests/deployment-windows-command-entry.test.mjs tests/deployment-windows-inactive-task.test.mjs tests/deployment-cold-activation-state.test.mjs tests/deployment-cold-policy-history.test.mjs tests/deployment-cold-runtime-completion.test.mjs tests/deployment-cold-retirement.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native process identity or command admission contracts failed.' }
          ./tests/deployment-windows-private-tests.ps1 -Tests @('tests/deployment-retirement-recovery.test.mjs') -NamePattern '^recovery manifest'
          if ($LASTEXITCODE -ne 0) { throw 'Saved recovery manifest budgets failed.' }
          ./tests/deployment-windows-private-tests.ps1 -Tests @('tests/deployment-state.test.mjs') -NamePattern '^(inactive-rollback-|INACTIVE-ROLLBACK-)'
          if ($LASTEXITCODE -ne 0) { throw 'Stopped rollback cleanup admission fences failed.' }
          & (Get-Command pwsh).Source -NoProfile -NonInteractive -File ./tests/deployment-windows-cold-policy-definition.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Cold task policy executable binding contracts failed.' }
          & (Get-Command pwsh).Source -NoProfile -NonInteractive -File ./tests/deployment-windows-private-archive.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native private journal archival contracts failed.' }
          & (Get-Command pwsh).Source -NoProfile -NonInteractive -File ./tests/deployment-windows-controller-capture.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native controller capture contracts failed.' }
          & (Get-Command pwsh).Source -NoProfile -NonInteractive -File ./tests/deployment-windows-command-supervisor.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native supervisor protocol contracts failed.' }
          & (Get-Command pwsh).Source -NoProfile -NonInteractive -File ./tests/deployment-windows-public-command.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Public Windows command contracts failed.' }
      - name: Verify stopped rollback interruption and actual cleanup
        shell: pwsh
        run: |
          $env:DEPLOYMENT_TEST_PWSH = (Get-Command pwsh).Source
          foreach ($step in @('task-restore-requested', 'task-registered', 'task-restored')) {
            & (Get-Command pwsh).Source -NoProfile -NonInteractive -File ./tests/deployment-windows-runtime-host.ps1 -Scenario task-inhibition -InactiveCompletionRecovery -InactiveCompletionRecoveryStep release-requested -ExternalInactiveRuntime -InactiveRollbackCrashStep $step
            if ($LASTEXITCODE -ne 0) { throw "Inactive Windows external-runtime rollback failed at $step." }
          }
      - name: Verify inactive task observation and released-prefix recovery
        shell: pwsh
        run: |
          $env:DEPLOYMENT_TEST_PWSH = (Get-Command pwsh).Source
          & (Get-Command pwsh).Source -NoProfile -NonInteractive -File ./tests/deployment-windows-runtime-host.ps1 -Scenario task-inhibition
          if ($LASTEXITCODE -ne 0) { throw 'Inactive Windows task observation contracts failed.' }
          & (Get-Command pwsh).Source -NoProfile -NonInteractive -File ./tests/deployment-windows-runtime-host.ps1 -Scenario task-inhibition -InactiveCompletion
          if ($LASTEXITCODE -ne 0) { throw 'Inactive Windows task completion contracts failed.' }
          foreach ($step in @('release-requested', 'lease-released', 'released', 'policy-restore-requested', 'permanent-policy-applied')) {
            & (Get-Command pwsh).Source -NoProfile -NonInteractive -File ./tests/deployment-windows-runtime-host.ps1 -Scenario task-inhibition -InactiveCompletionRecovery -InactiveCompletionRecoveryStep $step
            if ($LASTEXITCODE -ne 0) { throw "Inactive Windows completion recovery failed at $step." }
          }
      - name: Verify native recovery and original restore regressions
        shell: pwsh
        run: |
          $env:DEPLOYMENT_TEST_PWSH = (Get-Command pwsh).Source
          & (Get-Command pwsh).Source -NoProfile -NonInteractive -File ./tests/deployment-windows-private-runner.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Private Windows test runner diagnostics failed.' }
          & (Get-Command pwsh).Source -NoProfile -NonInteractive -File ./tests/deployment-windows-process-lifetime.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows fixture process lifetime observation failed.' }
          & (Get-Command pwsh).Source -NoProfile -NonInteractive -File ./tests/deployment-windows-runtime-host.ps1 -Scenario guarded-owner-exit
          if ($LASTEXITCODE -ne 0) { throw 'Guarded launch journal owner-death contract failed.' }
          & (Get-Command pwsh).Source -NoProfile -NonInteractive -File ./tests/deployment-windows-runtime-host.ps1 -Scenario guarded-release
          if ($LASTEXITCODE -ne 0) { throw 'Guarded launch journal release contract failed.' }
          ./tests/deployment-windows-private-tests.ps1 -Tests @('tests/deployment-receipt.test.mjs')
          ./tests/deployment-windows-private-tests.ps1 -Tests @('tests/deployment-retirement-recovery.test.mjs', 'tests/deployment-windows-restore-entry.test.mjs', 'tests/deployment-windows-restore-invocation.test.mjs') -NamePattern '^(recovery manifest admits bounded inventories|saved recovery bundle closes module dependencies|saved Windows restore entry|public Windows restore invocation)'
          ./tests/deployment-windows-private-tests.ps1 -Tests @('tests/deployment-windows-project-policy.test.mjs')
          ./tests/deployment-windows-private-tests.ps1 -Tests @('tests/deployment-windows-combined-restore.test.mjs') -NamePattern '^Windows combined restoration (uses explicit PowerShell|preserves inherited private Git root policy)'
          ./tests/deployment-windows-private-tests.ps1 -Tests @('tests/deployment-restore-project.test.mjs') -NamePattern '^Windows (project restoration preserves an eligible|unsupported saved ownership)'
      - name: Verify stopped restore evidence after original controller exit
        if: ${{ matrix.scenario == 'complete' }}
        shell: pwsh
        run: |
          ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-restore -StoppedProof
          ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-restore -StoppedProof -ColdActivationCrash
          ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-complete-proof-restore
          ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-complete-retirement-restore
      - name: Verify unacknowledged cold launch recovery and original journal archival
        if: ${{ matrix.scenario == 'complete' }}
        shell: pwsh
        run: |
          ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-restore -StoppedProof -ColdStartupCrash
      - name: Verify public task-option refusals in Windows PowerShell
        if: ${{ inputs.windows_application_only && inputs.windows_commands_only }}
        shell: powershell
        run: ./tests/deployment-windows-task-options.ps1
      - name: Verify native create-only first-task registration
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tests/deployment-windows-first-task.ps1
      - name: Verify public routing and legacy startup contracts
        if: ${{ inputs.windows_application_only && inputs.windows_commands_only }}
        shell: powershell
        run: |
          node tests/deploy-script-scheduled-task.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/start-script-healthcheck.test.js
          exit $LASTEXITCODE
      - name: Update actual application and verify saved restore outcome
        if: ${{ !(inputs.windows_application_only && inputs.windows_commands_only) }}
        shell: pwsh
        run: |
          $env:DEPLOYMENT_TEST_REAL_BUILD = '1'
          $env:DEPLOYMENT_TEST_WINDOWS_LIVE = '1'
          $env:DEPLOYMENT_TEST_WINDOWS_RESTORE_SCENARIO = '${{ matrix.scenario }}'
          $env:DEPLOYMENT_TEST_WINDOWS_COLD_ENTRY = '${{ inputs.windows_restore_scenario == 'cold-unlaunched' && 'unlaunched' || inputs.windows_restore_scenario == 'cold-requested' && 'requested' || inputs.windows_restore_scenario == 'cold-registered' && 'registered' || inputs.windows_restore_scenario == 'cold-enabled' && 'enabled' || inputs.windows_restore_scenario == 'cold-launch' && 'launch' || inputs.windows_restore_scenario == 'cold-startup' && 'startup' || inputs.windows_restore_scenario == 'cold-start' && 'start' || inputs.windows_restore_scenario == 'cold-completion' && 'completion' || inputs.windows_restore_scenario == 'cold-state' && 'state' || inputs.windows_restore_scenario == 'cold-receipt' && 'receipt' || 'terminal' }}'
          $env:DEPLOYMENT_TEST_PWSH = (Get-Command pwsh).Source
          $env:DEPLOYMENT_TEST_GIT = (Get-Command git).Source
          $env:DEPLOYMENT_TEST_NPM_CLI = Join-Path (Split-Path (Get-Command node).Source) 'node_modules/npm/bin/npm-cli.js'
          $timeoutSeconds = if ($env:DEPLOYMENT_TEST_WINDOWS_COLD_ENTRY -in @('startup', 'launch', 'enabled', 'requested', 'registered', 'unlaunched')) { 10500 } elseif ($env:DEPLOYMENT_TEST_WINDOWS_RESTORE_SCENARIO -eq 'copy-crashed') { 7800 } else { 6300 }
          ./tests/deployment-windows-private-tests.ps1 -Tests @('tests/deployment-native-operation.test.mjs') -NamePattern '^actual application source installs and builds' -TimeoutSeconds $timeoutSeconds

  windows-failed-application:
    if: ${{ inputs.windows_application_only && inputs.windows_live_only && inputs.windows_failed_application_only }}
    name: Actual Windows failed-update application phase
    runs-on: windows-2022
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update actual application and verify failed saved restore outcome
        shell: pwsh
        run: |
          $env:DEPLOYMENT_TEST_REAL_BUILD = '1'
          $env:DEPLOYMENT_TEST_WINDOWS_LIVE = '1'
          $env:DEPLOYMENT_TEST_WINDOWS_RESTORE_SCENARIO = 'failed'
          $env:DEPLOYMENT_TEST_WINDOWS_COLD_ENTRY = 'terminal'
          $env:DEPLOYMENT_TEST_PWSH = (Get-Command pwsh).Source
          $env:DEPLOYMENT_TEST_GIT = (Get-Command git).Source
          $env:DEPLOYMENT_TEST_NPM_CLI = Join-Path (Split-Path (Get-Command node).Source) 'node_modules/npm/bin/npm-cli.js'
          ./tests/deployment-windows-private-tests.ps1 -Tests @('tests/deployment-native-operation.test.mjs') -NamePattern '^actual application source installs and builds' -TimeoutSeconds 6300

  windows-first-native:
    if: ${{ (inputs.windows_application_only || !inputs.windows_restore_only) && !inputs.windows_first_application_only && !(inputs.windows_application_only && inputs.windows_live_only) }}
    name: Native Windows first deployment (${{ matrix.shard }})
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [foundations, cold-receipts]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect genuinely fresh Windows installations
        shell: pwsh
        env:
          DEPLOYMENT_TEST_RECEIPT_ONLY: ${{ inputs.windows_receipt_only }}
          DEPLOYMENT_TEST_COMMANDS_ONLY: ${{ inputs.windows_application_only && inputs.windows_commands_only }}
          DEPLOYMENT_TEST_FIRST_SHARD: ${{ matrix.shard }}
        run: |
          $env:DEPLOYMENT_TEST_PWSH = (Get-Command pwsh).Source
          $env:DEPLOYMENT_TEST_GIT = (Get-Command git.exe -CommandType Application | Select-Object -First 1).Source
          $env:DEPLOYMENT_TEST_NPM_CLI = Join-Path (Split-Path (Get-Command node.exe -CommandType Application | Select-Object -First 1).Source) 'node_modules/npm/bin/npm-cli.js'
          $pattern = '^(Windows first-install|saved recovery bundle closes module dependencies)'
          $tests = @('tests/deployment-windows-first-install.test.mjs', 'tests/deployment-windows-first-build.test.mjs', 'tests/deployment-windows-first-runtime.test.mjs', 'tests/deployment-windows-first-activation.test.mjs', 'tests/deployment-windows-first-readiness.test.mjs', 'tests/deployment-windows-first-completion.test.mjs', 'tests/deployment-windows-first-crash.test.mjs', 'tests/deployment-retirement-recovery.test.mjs')
          if ($env:DEPLOYMENT_TEST_RECEIPT_ONLY -eq 'true') {
            if ($env:DEPLOYMENT_TEST_COMMANDS_ONLY -ne 'true') { throw 'Receipt selection requires both Windows command-only flags.' }
            $pattern = '.*\((deployment-receipt|deployment-receipt-default-policy|cold-proof|cold-receipt-proof|cold-first-receipt-publication|cold-first-retirement|cold-first-retirement-actor-loss|cold-first-saved-closeout|cold-first-saved-receipt-publication|cold-first-saved-(?:lease-released|permanent-policy-applied|enable-applied))\)$|^saved recovery bundle closes module dependencies'
            $tests = @('tests/deployment-windows-first-completion.test.mjs', 'tests/deployment-windows-first-crash.test.mjs', 'tests/deployment-retirement-recovery.test.mjs')
          }
          $coldReceipts = '\((?:cold-receipt-proof|cold-first-[^)]*)\)$'
          $pattern = if ($env:DEPLOYMENT_TEST_FIRST_SHARD -eq 'cold-receipts') {
            "^(?=.*$coldReceipts)(?:$pattern)"
          } else {
            "^(?!.*$coldReceipts)(?:$pattern)"
          }
          $requiredName = if ($env:DEPLOYMENT_TEST_FIRST_SHARD -eq 'cold-receipts') {
            'Windows first-install abrupt actor death preserves the exact original lease boundary (cold-first-retirement-actor-loss)'
          } else {
            'Windows first-install completion preserves original-runtime handoff or settles its exact interrupted instance (deployment-receipt)'
          }
          if ($requiredName -cnotmatch $pattern) { throw 'First-install selection omits its required retirement or receipt case.' }
          ./tests/deployment-windows-private-tests.ps1 -Tests $tests -NamePattern $pattern -TimeoutSeconds 2400

  windows-first-application:
    if: ${{ inputs.windows_first_application_only || ((inputs.windows_application_only || !inputs.windows_restore_only) && !(inputs.windows_application_only && (inputs.windows_commands_only || inputs.windows_live_only))) }}
    name: Actual Windows first deployment core (${{ matrix.scenario }})
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(inputs.windows_first_public_only && '["public-first"]' || '["normal", "receipt-loss", "default-policy", "public-first"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy actual fresh application and run its saved finalizer
        shell: pwsh
        env:
          DEPLOYMENT_TEST_FIRST_ONLY: ${{ inputs.windows_first_application_only }}
          DEPLOYMENT_TEST_FIRST_PUBLIC_ONLY: ${{ inputs.windows_first_public_only }}
          DEPLOYMENT_TEST_WINDOWS_FIRST_RECEIPT_LOSS: ${{ matrix.scenario == 'receipt-loss' && '1' || '0' }}
          DEPLOYMENT_TEST_WINDOWS_FIRST_DEFAULT_POLICY: ${{ matrix.scenario == 'default-policy' && '1' || '0' }}
          DEPLOYMENT_TEST_WINDOWS_FIRST_PUBLIC: ${{ matrix.scenario == 'public-first' && '1' || '0' }}
          DEPLOYMENT_TEST_COMMANDS_ONLY: ${{ inputs.windows_application_only && inputs.windows_commands_only }}
        run: |
          node --test tests/deployment-windows-first-application-crash.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'First-application crash observer contracts failed.' }
          if ($env:DEPLOYMENT_TEST_FIRST_ONLY -eq 'true' -and $env:DEPLOYMENT_TEST_COMMANDS_ONLY -ne 'true') {
            throw 'First-application selection requires both Windows command-only flags.'
          }
          if ($env:DEPLOYMENT_TEST_FIRST_PUBLIC_ONLY -eq 'true' -and $env:DEPLOYMENT_TEST_FIRST_ONLY -ne 'true') {
            throw 'Public-first selection requires first-application-only selection.'
          }
          $env:DEPLOYMENT_TEST_WINDOWS_FIRST_APPLICATION = '1'
          $env:DEPLOYMENT_TEST_PWSH = (Get-Command pwsh).Source
          $env:DEPLOYMENT_TEST_GIT = (Get-Command git.exe -CommandType Application | Select-Object -First 1).Source
          $env:DEPLOYMENT_TEST_NPM_CLI = Join-Path (Split-Path (Get-Command node.exe -CommandType Application | Select-Object -First 1).Source) 'node_modules/npm/bin/npm-cli.js'
          ./tests/deployment-windows-private-tests.ps1 -Tests @('tests/deployment-windows-first-deployment.test.mjs')

