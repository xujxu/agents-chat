      - name: Bind Windows HTTP readiness to retained native listener and activation authority
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-readiness
      - name: Activate exact guarded replacement with restored task permissions
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-restore
      - name: Settle unreleased transaction activation after original controller exit
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-exit
      - name: Refuse changed activation-state evidence and settle its guarded generation
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-state-change
      - name: Refuse activation before original retirement and replacement
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-early
      - name: Settle unverified task and original Job after controller exit
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario guarded-owner-exit

  windows-completion-proof:
    if: ${{ !inputs.windows_restore_only && !inputs.windows_application_only }}
    name: Native Windows completed task proof
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require exclusive native Windows admission and crash release
        shell: pwsh
        run: ./tests/deployment-windows-private-admission.ps1
      - name: Require original-controller-bound Windows admission
        shell: pwsh
        run: ./tests/deployment-windows-admission-bridge.ps1
      - name: Require shared admission at Windows ownership entrypoints
        shell: pwsh
        run: ./tests/deployment-windows-admission-state.ps1
      - name: Reopen completed original task evidence in a fresh native process
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-complete-proof
      - name: Reopen completed restore evidence with original custom task permissions
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-complete-proof-restore
      - name: Reopen originally disabled completed task without changing its policy
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-complete-proof-disabled

  windows-completion-recovery:
    if: ${{ !inputs.windows_restore_only && !inputs.windows_application_only }}
    name: Native Windows completion recovery (${{ matrix.scenario }}, ${{ matrix.crash }})
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: transaction-activate-complete-recovery
            crash: release-requested
          - scenario: transaction-activate-complete-recovery
            crash: lease-released
          - scenario: transaction-activate-complete-recovery-restore
            crash: permanent-policy-applied
          - scenario: transaction-activate-complete-recovery
            crash: enable-applied
          - scenario: transaction-activate-complete-recovery-disabled
            crash: enable-applied
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Recover or refuse after genuine completion actor death
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario '${{ matrix.scenario }}' -CrashStep '${{ matrix.crash }}'

  windows-managed-discovery:
    if: ${{ !inputs.windows_application_only && !(inputs.windows_restore_only && inputs.windows_contracts_only) }}
    name: Native Windows managed discovery (${{ matrix.scenario }})
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(inputs.windows_restore_only && '["transaction-activate-complete-retirement"]' || '["transaction-activate-complete-retirement","transaction-activate-complete-retirement-restore","transaction-activate-complete-retirement-disabled"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Capture actual admission and discover the runtime after final unlock
        shell: pwsh
        run: |
          $sourceBuild = '${{ matrix.scenario }}' -ceq 'transaction-activate-complete-retirement'
          ./tests/deployment-windows-runtime-host.ps1 -Scenario '${{ matrix.scenario }}' -DiscoverManagedTask -DiscoveredAdmission -OwnedSourceBuild:$sourceBuild
      - name: Capture private Windows controller outside mutable source
        if: matrix.scenario == 'transaction-activate-complete-retirement'
        shell: pwsh
        run: ./tests/deployment-windows-controller-capture.ps1

  windows-completed-closeout:
    if: ${{ !inputs.windows_application_only && !(inputs.windows_restore_only && inputs.windows_contracts_only) }}
    name: Native Windows completed deployment closeout
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify identity-bound private evidence archival and retirement
        shell: pwsh
        run: ./tests/deployment-windows-private-file.ps1
      - name: Preserve original failure context through native recovery callbacks
        shell: pwsh
        run: node --test tests/deployment-transaction.test.mjs
      - name: Diagnose independent cold recovery alongside native worker retirement
        shell: pwsh
        run: |
          ./tests/deployment-windows-private-tests.ps1 -Tests @('tests/deployment-retirement-recovery.test.mjs', 'tests/deployment-worker-retirement.test.mjs') -NamePattern '^(independent saved recovery finishes partial retirement|cold worker retirement preserves failed-update evidence|completed live operation retires only worker artifacts|final marker deletion failure)'
      - name: Close completed Windows deployment through its saved entry
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-complete-retirement -CompletedCloseout
      - name: Resume completed Windows restore from partial receipt retirement
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-complete-retirement-restore -CompletedCloseout

  windows-prior-runtime-recovery:
    if: ${{ !inputs.windows_application_only && !(inputs.windows_restore_only && inputs.windows_contracts_only) }}
    name: Native Windows prior runtime recovery (${{ matrix.phase }})
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        phase: [copying, backup-ready, source-selected, changed-configuration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Recover only before source mutation and retain the original failure
        shell: pwsh
        run: |
          if ('${{ matrix.phase }}' -ceq 'source-selected') {
            ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-retire-refused -PriorRuntimeRecovery source-selected
          } elseif ('${{ matrix.phase }}' -ceq 'changed-configuration') {
            ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-replace-refused -PriorRuntimeRecovery copying
          } else {
            ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-complete-retirement -CompletedCloseout -PriorRuntimeRecovery '${{ matrix.phase }}'
          }

  windows-task-retirement:
    if: ${{ !inputs.windows_restore_only && !inputs.windows_application_only }}
    name: Native Windows task receipt retirement
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Retire original update receipts and recover after controller loss
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-complete-retirement
      - name: Retire original restore receipts with retained native policy
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-complete-retirement-restore
      - name: Retire disabled-task receipts without enabling automation
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-complete-retirement-disabled
