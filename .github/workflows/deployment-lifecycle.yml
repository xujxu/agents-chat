name: Deployment lifecycle

on:
  push:
    branches: [feat/deployment-backup]
    paths:
      - 'scripts/deploy*'
      - 'scripts/upgrade*'
      - 'scripts/restore*'
      - 'scripts/deployment/**'
      - 'scripts/start.ps1'
      - 'scripts/service-watchdog.ps1'
      - 'scripts/install-scheduled-task.ps1'
      - 'tests/deployment-*'
      - '.github/workflows/deployment-lifecycle.yml'
  pull_request:
    paths:
      - 'scripts/deploy*'
      - 'scripts/upgrade*'
      - 'scripts/restore*'
      - 'scripts/deployment/**'
      - 'scripts/start.ps1'
      - 'scripts/service-watchdog.ps1'
      - 'scripts/install-scheduled-task.ps1'
      - 'tests/deployment-*'
      - '.github/workflows/deployment-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-lifecycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    name: Contracts (${{ matrix.os }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        suite: [state, cli, snapshot, transaction]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run behavioral contracts
        run: node --test tests/deployment-${{ matrix.suite }}.test.mjs
