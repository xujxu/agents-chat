  linux-native:
    if: ${{ !inputs.windows_restore_only && !inputs.windows_application_only }}
    name: Native Linux worker domain
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Characterize retained cgroup observation
        run: sudo "$(command -v node)" tests/deployment-linux-domain-probe.mjs
      - name: Retain installed unit source identities
        run: sudo "$(command -v node)" --test tests/deployment-linux-service-sources.test.mjs
      - name: Observe initially inactive and failed service identities
        run: sudo "$(command -v node)" --test tests/deployment-linux-inactive-service.test.mjs
      - name: Maintain initially stopped service authority
        run: sudo "$(command -v node)" --test tests/deployment-linux-inactive-maintenance.test.mjs
      - name: Restore initially stopped services after controller death
        run: sudo "$(command -v node)" --test tests/deployment-linux-inactive-cold-restore.test.mjs
      - name: Inspect configuration without a running service process
        run: sudo "$(command -v node)" --test tests/deployment-linux-inactive-configuration.test.mjs
      - name: Discover retained inactive runtime executables
        run: sudo "$(command -v node)" --test tests/deployment-linux-inactive-discovery.test.mjs
      - name: Restore actual Git commit-graph layouts with privileged file ownership
        run: sudo "$(command -v node)" --test tests/deployment-git-objects.test.mjs
      - name: Exercise actual saved-engine systemd workers
        run: sudo env "DEPLOYMENT_TEST_GIT=$(command -v git)" "DEPLOYMENT_TEST_NPM_CLI=$(readlink -f "$(command -v npm)")" "$(command -v node)" --test tests/deployment-linux-worker.test.mjs tests/deployment-native-operation.test.mjs tests/deployment-linux-runtime.test.mjs tests/deployment-linux-service.test.mjs tests/deployment-linux-configuration.test.mjs tests/deployment-controller-capture.test.mjs tests/deployment-linux-restore-invocation.test.mjs tests/deployment-recovery-engine-retention.test.mjs tests/deployment-linux-first-install.test.mjs

  linux-service-recovery:
    if: ${{ !inputs.windows_restore_only && !inputs.windows_application_only }}
    name: Native Linux service recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Recover interrupted actual service retirement
        run: sudo "$(command -v node)" --test tests/deployment-recovery-admission.test.mjs tests/deployment-linux-service-recovery.test.mjs tests/deployment-linux-cold-service.test.mjs

  linux-service-resumption:
    if: ${{ !inputs.windows_restore_only && !inputs.windows_application_only }}
    name: Native Linux service recovery resumption
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resume interrupted actual service recovery and unlock
        run: sudo "$(command -v node)" --test tests/deployment-linux-service-resumption.test.mjs

  linux-worker-handoff:
    if: ${{ !inputs.windows_restore_only && !inputs.windows_application_only }}
    name: Native Linux retirement handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Recover interrupted live worker retirement
        run: sudo "$(command -v node)" --test tests/deployment-linux-worker-handoff.test.mjs

  windows-native:
    if: ${{ !inputs.windows_restore_only && !inputs.windows_application_only }}
    name: Native Windows Job ownership
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exercise explicit Job and gated launcher
        shell: pwsh
        run: ./tests/deployment-windows-job.ps1
      - name: Exercise saved Windows coordinator and receipts
        shell: pwsh
        run: |
          $env:DEPLOYMENT_TEST_PWSH = (Get-Command pwsh).Source
          $env:DEPLOYMENT_TEST_NPM_CLI = Join-Path (Split-Path (Get-Command node).Source) 'node_modules/npm/bin/npm-cli.js'
          $env:DEPLOYMENT_TEST_GIT = (Get-Command git).Source
          ./tests/deployment-windows-private-tests.ps1 -Tests @('tests/deployment-windows-worker.test.mjs', 'tests/deployment-native-operation.test.mjs')

  windows-task-options:
    if: ${{ !inputs.windows_restore_only && !inputs.windows_application_only }}
    name: Native Windows task options
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run production private controller with literal stdio and original Job settlement
        shell: pwsh
        run: ./tests/deployment-windows-controller-process.ps1
      - name: Publish private installed runtime bundle without source ACL repair
        shell: pwsh
        run: ./tests/deployment-windows-runtime-bundle.ps1
      - name: Publish disabled replacement with original transaction authority
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-replace
      - name: Probe private Node file creation with a distinct original-Job child token
        shell: pwsh
        run: ./tests/deployment-windows-controller-token.ps1
      - name: Verify portable Scheduled Task and child parameters with PowerShell 5.1
        shell: powershell
        run: ./tests/deployment-windows-task-options.ps1
      - name: Preserve existing deployment and startup regressions
        shell: powershell
        run: |
          node tests/deploy-script-scheduled-task.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/start-script-healthcheck.test.js
          exit $LASTEXITCODE
      - name: Observe real task definitions without adopting process ownership
        shell: powershell
        run: node --test tests/deployment-windows-task-inspection.test.mjs
      - name: Bind runtime control transport to the actual Scheduled Task owner
        shell: pwsh
        run: ./tests/deployment-windows-runtime-pipe.ps1
      - name: Retain original task-side runtime Job across controller connections
        shell: pwsh
        run: ./tests/deployment-windows-runtime-domain.ps1
      - name: Retain private runtime configuration files and permissions
        shell: pwsh
        run: ./tests/deployment-windows-private-file.ps1
      - name: Run installed private runtime host under an actual Scheduled Task
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1
      - name: Refuse changed installed runtime configuration and settle original ownership
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario configuration-change
      - name: Verify native restart inhibition around original managed owner settlement
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario task-inhibition
      - name: Retain durable original task stop authority and private receipts
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario durable-stop
      - name: Close Node task maintenance without releasing inhibition
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario node-close
      - name: Preserve stopped task evidence after original Node controller exits
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario node-exit
      - name: Bind native task maintenance to private Node transaction state
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-close
      - name: Preserve native transaction inhibition after Node controller exits
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-exit
      - name: Refuse changed original native task transaction state
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-changed-state
      - name: Bind native task maintenance to original restore-phase authority
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-restore
      - name: Refuse original task retirement before activation phase
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-retire-refused
      - name: Retire original stopped task owner with durable transaction authority
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-retire
      - name: Retire original task owner for restore activation
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-retire-restore
      - name: Refuse replacement before original retirement
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-replace-early
      - name: Publish disabled replacement for restore
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-replace-restore
      - name: Refuse changed replacement configuration before task mutation
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-replace-refused
      - name: Refuse Scheduler expansion in replacement paths
        shell: pwsh
        run: |
          ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-replace-variable
          ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-replace-argument

  windows-runtime-activation:
    if: ${{ !inputs.windows_restore_only && !inputs.windows_application_only }}
    name: Native Windows activation lease
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Authenticate original lease release without changing runtime ownership
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario guarded-release
      - name: Complete healthy native update and release original activation lease
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-complete
      - name: Complete healthy native restore with retained task permissions
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-complete-restore
      - name: Preserve originally disabled policy after healthy native completion
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-complete-disabled
      - name: Refuse changed terminal state before permanent task policy
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-complete-changed-state
      - name: Retain and release original activation controller with bounded lifetime
        shell: pwsh
        run: ./tests/deployment-windows-runtime-lease.ps1
      - name: Retain native IPv4 listener bind time and original Job ownership
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario listener-v4
      - name: Retain native dual-stack listener bind time and original Job ownership
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario listener-v6
      - name: Refuse independent wildcard bindings in the same original process
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario listener-independent-pair
      - name: Activate exact guarded replacement in the native update transaction
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate
      - name: Bind Windows HTTP readiness to retained native listener and activation authority
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-readiness
      - name: Activate exact guarded replacement with restored task permissions
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-restore
      - name: Settle unreleased transaction activation after original controller exit
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-exit
      - name: Refuse changed activation-state evidence and settle its guarded generation
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-state-change
      - name: Refuse activation before original retirement and replacement
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-early
      - name: Settle unverified task and original Job after controller exit
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario guarded-owner-exit

  windows-completion-proof:
    if: ${{ !inputs.windows_restore_only && !inputs.windows_application_only }}
    name: Native Windows completed task proof
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require exclusive native Windows admission and crash release
        shell: pwsh
        run: ./tests/deployment-windows-private-admission.ps1
      - name: Require original-controller-bound Windows admission
        shell: pwsh
        run: ./tests/deployment-windows-admission-bridge.ps1
      - name: Require shared admission at Windows ownership entrypoints
        shell: pwsh
        run: ./tests/deployment-windows-admission-state.ps1
      - name: Reopen completed original task evidence in a fresh native process
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-complete-proof
      - name: Reopen completed restore evidence with original custom task permissions
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-complete-proof-restore
      - name: Reopen originally disabled completed task without changing its policy
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-complete-proof-disabled

  windows-completion-recovery:
    if: ${{ !inputs.windows_restore_only && !inputs.windows_application_only }}
    name: Native Windows completion recovery (${{ matrix.scenario }}, ${{ matrix.crash }})
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: transaction-activate-complete-recovery
            crash: release-requested
          - scenario: transaction-activate-complete-recovery
            crash: lease-released
          - scenario: transaction-activate-complete-recovery-restore
            crash: permanent-policy-applied
          - scenario: transaction-activate-complete-recovery
            crash: enable-applied
          - scenario: transaction-activate-complete-recovery-disabled
            crash: enable-applied
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Recover or refuse after genuine completion actor death
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario '${{ matrix.scenario }}' -CrashStep '${{ matrix.crash }}'

  windows-managed-discovery:
    if: ${{ !inputs.windows_application_only && !(inputs.windows_restore_only && inputs.windows_contracts_only) }}
    name: Native Windows managed discovery (${{ matrix.scenario }})
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(inputs.windows_restore_only && '["transaction-activate-complete-retirement"]' || '["transaction-activate-complete-retirement","transaction-activate-complete-retirement-restore","transaction-activate-complete-retirement-disabled"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Capture actual admission and discover the runtime after final unlock
        shell: pwsh
        run: |
          $sourceBuild = '${{ matrix.scenario }}' -ceq 'transaction-activate-complete-retirement'
          ./tests/deployment-windows-runtime-host.ps1 -Scenario '${{ matrix.scenario }}' -DiscoverManagedTask -DiscoveredAdmission -OwnedSourceBuild:$sourceBuild
      - name: Capture private Windows controller outside mutable source
        if: matrix.scenario == 'transaction-activate-complete-retirement'
        shell: pwsh
        run: ./tests/deployment-windows-controller-capture.ps1

  windows-completed-closeout:
    if: ${{ !inputs.windows_application_only && !(inputs.windows_restore_only && inputs.windows_contracts_only) }}
    name: Native Windows completed deployment closeout
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify identity-bound private evidence archival and retirement
        shell: pwsh
        run: ./tests/deployment-windows-private-file.ps1
      - name: Preserve original failure context through native recovery callbacks
        shell: pwsh
        run: node --test tests/deployment-transaction.test.mjs
      - name: Diagnose independent cold recovery alongside native worker retirement
        shell: pwsh
        run: |
          ./tests/deployment-windows-private-tests.ps1 -Tests @('tests/deployment-retirement-recovery.test.mjs', 'tests/deployment-worker-retirement.test.mjs') -NamePattern '^(independent saved recovery finishes partial retirement|cold worker retirement preserves failed-update evidence|completed live operation retires only worker artifacts|final marker deletion failure)'
      - name: Close completed Windows deployment through its saved entry
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-complete-retirement -CompletedCloseout
      - name: Resume completed Windows restore from partial receipt retirement
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-complete-retirement-restore -CompletedCloseout

  windows-prior-runtime-recovery:
    if: ${{ !inputs.windows_application_only && !(inputs.windows_restore_only && inputs.windows_contracts_only) }}
    name: Native Windows prior runtime recovery (${{ matrix.phase }})
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        phase: [copying, backup-ready, source-selected, changed-configuration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Recover only before source mutation and retain the original failure
        shell: pwsh
        run: |
          if ('${{ matrix.phase }}' -ceq 'source-selected') {
            ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-retire-refused -PriorRuntimeRecovery source-selected
          } elseif ('${{ matrix.phase }}' -ceq 'changed-configuration') {
            ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-replace-refused -PriorRuntimeRecovery copying
          } else {
            ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-complete-retirement -CompletedCloseout -PriorRuntimeRecovery '${{ matrix.phase }}'
          }

  windows-task-retirement:
    if: ${{ !inputs.windows_restore_only && !inputs.windows_application_only }}
    name: Native Windows task receipt retirement
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Retire original update receipts and recover after controller loss
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-complete-retirement
      - name: Retire original restore receipts with retained native policy
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-complete-retirement-restore
      - name: Retire disabled-task receipts without enabling automation
        shell: pwsh
        run: ./tests/deployment-windows-runtime-host.ps1 -Scenario transaction-activate-complete-retirement-disabled
