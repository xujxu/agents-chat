name: Deployment lifecycle

on:
  push:
    branches: [feat/deployment-backup]
    paths:
      - 'scripts/deploy*'
      - 'scripts/update*'
      - 'scripts/restore*'
      - 'scripts/deployment/**'
      - 'scripts/start.ps1'
      - 'scripts/service-watchdog.ps1'
      - 'scripts/install-scheduled-task.ps1'
      - 'tests/deployment-*'
      - '.github/workflows/deployment-lifecycle.yml'
  pull_request:
    paths:
      - 'scripts/deploy*'
      - 'scripts/update*'
      - 'scripts/restore*'
      - 'scripts/deployment/**'
      - 'scripts/start.ps1'
      - 'scripts/service-watchdog.ps1'
      - 'scripts/install-scheduled-task.ps1'
      - 'tests/deployment-*'
      - '.github/workflows/deployment-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-lifecycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    name: Contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run behavioral contracts
        run: >-
          node --test
          tests/deployment-state.test.mjs
          tests/deployment-cli.test.mjs
          tests/deployment-snapshot.test.mjs
          tests/deployment-transaction.test.mjs
          tests/deployment-source.test.mjs
          tests/deployment-update-policy.test.mjs
