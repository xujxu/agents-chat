name: Installed Sense browser acceptance
on:
  push:
    branches: [experiment/voice-natural-long]
    paths:
      - 'scripts/voice_browser_*.py'
      - 'scripts/test_voice_browser_*.py'
      - 'scripts/voice/installed-api-run.mjs'
      - 'tests/helpers/voiceBrowser*.ts'
      - 'tests/voice-installed-browser.spec.ts'
      - 'tests/voice-browser-capture.spec.ts'
      - '.github/workflows/voice-installed-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install opencc-python-reimplemented==0.1.7
      - run: python -m unittest discover -s scripts -p 'test_voice_browser_*.py' -v
  capture-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      NEXTAUTH_SECRET: isolated-browser-contract-secret
      NEXTAUTH_URL: http://localhost:3011
      PLAYWRIGHT_BASE_URL: http://localhost:3011
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit --strict --skipLibCheck --esModuleInterop --target ES2017 --lib dom,dom.iterable,esnext --module esnext --moduleResolution bundler --jsx react-jsx tests/voice-browser-capture.spec.ts tests/voice-installed-browser.spec.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Observational capture and existing recorder regressions
        shell: bash
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3011 > fixture-server.log 2>&1 &
          app=$!
          trap 'kill "$app"; wait "$app" || true' EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent --max-time 2 http://localhost:3011/api/auth/providers >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          npx playwright test --config tests/playwright.config.ts tests/voice-browser-capture.spec.ts tests/voice-input.spec.ts --project=desktop-chromium --workers=1 --reporter=line --trace=off
  collect:
    if: github.event_name == 'workflow_dispatch'
    needs: [contracts, capture-contracts]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            package_run: '35968099304'
            artifact: '10794617845'
          - os: windows-2022
            platform: win32
            package_run: '35987278609'
            artifact: '10802394350'
    env:
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      NEXTAUTH_SECRET: isolated-installed-browser-secret
      NEXTAUTH_URL: http://localhost:3011
      PLAYWRIGHT_BASE_URL: http://localhost:3011
      NEXT_TELEMETRY_DISABLED: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install opencc-python-reimplemented==0.1.7
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35858271102
          artifact-ids: 10748244312
          merge-multiple: true
          path: short
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35863991538
          artifact-ids: 10752270787
          merge-multiple: true
          path: meeting
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.package_run }}
          artifact-ids: ${{ matrix.artifact }}
          merge-multiple: true
          path: package
      - run: python scripts/voice_chain_report.py prepare short meeting corpus
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx tsc --noEmit --strict --skipLibCheck --esModuleInterop --target ES2017 --lib dom,dom.iterable,esnext --module esnext --moduleResolution bundler --jsx react-jsx tests/voice-installed-browser.spec.ts
      - run: npm run build
      - run: npx tsc --noEmit --incremental false
      - name: Actual installed Sense paired browser and API corpus
        run: node scripts/voice/installed-api-run.mjs package sensevoice-small-q8 browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-browser-${{ matrix.platform }}
          path: installed-browser-evidence/
          if-no-files-found: error
          retention-days: 30
  baseline:
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    needs: collect
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install opencc-python-reimplemented==0.1.7
      - uses: actions/download-artifact@v4
        with:
          name: installed-browser-linux
          path: evidence/linux
      - uses: actions/download-artifact@v4
        with:
          name: installed-browser-win32
          path: evidence/win32
      - name: Prepare original fixed ONNX baseline
        run: |
          mkdir sherpa sense
          curl -fL --retry 3 --max-time 240 https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-linux-x64-shared-no-tts.tar.bz2 -o runtime.tar.bz2
          echo 'd0f96c8b65c6cd0974fada22737e337de81bc8cd2abbec2e39caf358b1eec5fc  runtime.tar.bz2' | sha256sum --check
          tar -xjf runtime.tar.bz2 --strip-components=1 -C sherpa
          curl -fL --retry 3 --max-time 600 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17.tar.bz2 -o model.tar.bz2
          echo '7d1efa2138a65b0b488df37f8b89e3d91a60676e416f515b952358d83dfd347e  model.tar.bz2' | sha256sum --check
          tar -xjf model.tar.bz2 --strip-components=1 -C sense
      - run: python scripts/voice_browser_baseline.py evidence sherpa sense baseline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-browser-baseline
          path: baseline/
          if-no-files-found: error
          retention-days: 30
  report:
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    needs: [collect, baseline]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install opencc-python-reimplemented==0.1.7
      - uses: actions/download-artifact@v4
        with:
          name: installed-browser-linux
          path: evidence/linux
      - uses: actions/download-artifact@v4
        with:
          name: installed-browser-win32
          path: evidence/win32
      - uses: actions/download-artifact@v4
        with:
          name: installed-browser-baseline
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35858271102
          artifact-ids: 10751002303
          merge-multiple: true
          path: short-baseline
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35870441019
          artifact-ids: 10755950119
          merge-multiple: true
          path: long-baseline
      - run: python scripts/voice_browser_evidence.py evidence baseline short-baseline/scored-results.jsonl long-baseline/long-report/scored-results.json browser-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-browser-report
          path: browser-report/
          if-no-files-found: error
          retention-days: 30
