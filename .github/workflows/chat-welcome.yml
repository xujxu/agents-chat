name: Chat welcome UX
on:
  push:
    branches: [fix/chat-welcome-typography, deploy/voice-welcome-ux]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chat-welcome-${{ github.ref }}
  cancel-in-progress: true
jobs:
  welcome:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      NEXTAUTH_SECRET: isolated-welcome-ci-secret
      NEXTAUTH_URL: http://localhost:3011
      PLAYWRIGHT_BASE_URL: http://localhost:3011
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Voice logic regressions
        run: npx --yes --package=tsx@4.20.6 tsx --test tests/voice-audio.test.ts tests/voice-jobs.test.ts tests/voice-memory.test.ts
      - run: npx playwright install --with-deps chromium webkit
      - name: Build and check types
        run: npm run build && npx tsc --noEmit --incremental false
      - name: Start isolated application
        run: |
          mkdir artifacts
          chmod +x tests/fixtures/voice-whisper.py
          VOICE_ENABLED=1 VOICE_WHISPER_PATH="$PWD/tests/fixtures/voice-whisper.py" \
            VOICE_MODEL_PATH="$PWD/tests/fixtures/voice-whisper.py" \
            node_modules/.bin/next start --hostname 127.0.0.1 --port 3011 > artifacts/server.log 2>&1 &
          echo "$!" > artifacts/server.pid
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 2 http://localhost:3011/login >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Welcome and typography across devices
        run: >-
          npx playwright test --config tests/playwright.config.ts tests/chat-welcome.spec.ts
          --workers=1 --timeout=45000 --global-timeout=420000 --max-failures=3
          --trace=retain-on-failure --reporter=line --output=artifacts/welcome
      - name: Voice integration regressions
        env:
          VOICE_API_FIXTURE: '1'
        run: >-
          npx playwright test --config tests/playwright.config.ts
          tests/voice-input.spec.ts tests/voice-api.spec.ts
          --workers=1 --timeout=45000 --global-timeout=600000 --max-failures=3
          --trace=retain-on-failure --reporter=line --output=artifacts/voice
      - name: Restart with voice disabled for existing composer coverage
        run: |
          kill "$(cat artifacts/server.pid)"
          for attempt in $(seq 1 30); do
            if ! kill -0 "$(cat artifacts/server.pid)" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$(cat artifacts/server.pid)" 2>/dev/null; then exit 1; fi
          VOICE_ENABLED=0 node_modules/.bin/next start --hostname 127.0.0.1 --port 3011 > artifacts/disabled-server.log 2>&1 &
          echo "$!" > artifacts/server.pid
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 2 http://localhost:3011/login >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Loading and mobile composer regressions
        run: >-
          npx playwright test --config tests/playwright.config.ts
          tests/chat-selection-loading.spec.ts tests/mobile-composer-viewport.spec.ts
          --workers=1 --timeout=60000 --global-timeout=480000 --max-failures=2
          --trace=retain-on-failure --reporter=line --output=artifacts/regression
      - name: Stop app
        if: always()
        run: |
          if [ -f artifacts/server.pid ] && kill -0 "$(cat artifacts/server.pid)" 2>/dev/null; then
            kill "$(cat artifacts/server.pid)"
          fi
      - name: Package portable application
        run: |
          python3 - <<'PY'
          import pathlib
          root = pathlib.Path.cwd()
          for link in (root / '.next/node_modules').iterdir():
              if link.is_symlink():
                  relative = link.resolve().relative_to(root / 'node_modules')
                  link.unlink()
                  link.symlink_to(pathlib.Path('../../node_modules') / relative)
          PY
          printf '%s\n' "$GITHUB_SHA" > artifacts/revision.txt
          node --version > artifacts/node-version.txt
          sha256sum package-lock.json > artifacts/package-lock.sha256
          tar --exclude=.next/cache --exclude=.next/standalone -czf artifacts/next-build.tar.gz .next
          (cd artifacts && sha256sum next-build.tar.gz > next-build.sha256)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-welcome-${{ github.sha }}
          path: artifacts/
          retention-days: 7
