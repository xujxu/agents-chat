name: Sense feature exchange diagnostics
on:
  push:
    branches: [experiment/voice-natural-long]
    paths:
      - 'scripts/voice_feature_*.py'
      - 'scripts/test_voice_feature_*.py'
      - '.github/workflows/voice-feature-exchange.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p test_voice_feature_exchange.py -v
