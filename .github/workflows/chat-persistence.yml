name: Chat persistence

on:
  push:
    branches:
      - fix/incremental-chat-history
  pull_request:
    paths:
      - 'app/features/chat/**'
      - 'app/api/chats/**'
      - 'app/api/chat-transfers/**'
      - 'app/api/acp/**'
      - 'lib/chatStore.ts'
      - 'lib/chatDeltaValidation.ts'
      - 'lib/chatSync*.ts'
      - 'lib/chatTransferStore.ts'
      - 'lib/acp/preparedPrompt.ts'
      - 'tests/chat-*'
      - '.github/workflows/chat-persistence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-persistence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      NEXTAUTH_SECRET: isolated-chat-persistence-ci-secret
      NEXTAUTH_URL: http://localhost:3011
      PLAYWRIGHT_BASE_URL: http://localhost:3011
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a3cbf0979e03797c982eb52f0530067a7e7a8c73
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies and browsers
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Persistence logic regressions
        run: >-
          npx --yes --package=tsx@4.20.6 tsx --test
          tests/chat-incremental-save.test.ts
          tests/chat-recovery.test.ts
          tests/chat-transfer-client.test.ts
          tests/chat-store-delta.test.ts
          tests/chat-sync-store.test.ts
          tests/chat-store-message-merge.test.ts
          tests/chat-store-stale-reconciliation.test.ts
          tests/chat-selection-load-guard.test.ts
      - name: Build and check types
        run: |
          npm run build
          npx tsc --noEmit --incremental false
      - name: Start isolated application
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/revision.txt
          node_modules/.bin/next start --hostname 127.0.0.1 --port 3011 >artifacts/server.log 2>&1 &
          server_pid=$!
          echo "$server_pid" > artifacts/server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 3 "$PLAYWRIGHT_BASE_URL/login" >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat artifacts/server.log
              exit 1
            fi
            sleep 2
          done
          cat artifacts/server.log
          exit 1
      - name: Large history, API, failures, and chat selection
        run: >-
          npx playwright test --config tests/playwright.config.ts
          tests/chat-persistence.spec.ts tests/chat-selection-loading.spec.ts tests/chat-outbox.spec.ts tests/chat-sync-api.spec.ts tests/chat-acp-reference.spec.ts tests/chat-account-recovery.spec.ts
          --project=desktop-chromium --workers=1
          --timeout=60000 --global-timeout=480000 --max-failures=3
          --trace=retain-on-failure --reporter=line
          --output=artifacts/persistence
      - name: Existing send and persistence behavior
        run: >-
          npx playwright test --config tests/playwright.config.ts tests/test-ui.spec.ts
          --project=desktop-chromium --workers=1
          --grep='should send a message and receive a reply|should show failed send status on the user message and allow resend|should remove partial workflow agent messages when one initial send fails|should persist messages to SQLite after send and reload|should preserve messages when a stale browser saves the same chat|should switch between chats and remember context|attachment-only send is allowed|should manually resend a mentioned failed message'
          --timeout=60000 --global-timeout=480000 --max-failures=3
          --trace=retain-on-failure --reporter=line
          --output=artifacts/existing-behavior
      - name: Mobile persistence
        run: >-
          npx playwright test --config tests/playwright.config.ts tests/chat-persistence.spec.ts
          --project=iphone-webkit --project=android-chromium --workers=1
          --timeout=60000 --global-timeout=480000 --max-failures=3
          --trace=retain-on-failure --reporter=line
          --output=artifacts/mobile
      - name: Repeat WebKit network and reload regressions
        run: >-
          npx playwright test --config tests/playwright.config.ts tests/chat-persistence.spec.ts
          --project=iphone-webkit --workers=1 --repeat-each=3
          --grep='network save failure|failed auxiliary chat read|refresh during an in-flight save'
          --timeout=60000 --global-timeout=240000 --max-failures=2
          --trace=retain-on-failure --reporter=line
          --output=artifacts/webkit-network
      - name: Stop isolated application
        if: always()
        run: |
          if [ -f artifacts/server.pid ]; then
            server_pid="$(cat artifacts/server.pid)"
            if kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid"
            fi
          fi
      - name: Export verified production build
        if: success() && github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p production-artifact
          git rev-parse HEAD > production-artifact/revision.txt
          node --version > production-artifact/node-version.txt
          sha256sum package-lock.json > production-artifact/package-lock.sha256
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const modules = path.resolve('node_modules');
          for (const entry of fs.readdirSync('.next/node_modules', { withFileTypes: true })) {
            if (!entry.isSymbolicLink()) continue;
            const link = path.resolve('.next/node_modules', entry.name);
            const target = fs.realpathSync(link);
            const relative = path.relative(modules, target);
            if (relative.startsWith('..') || path.isAbsolute(relative)) {
              throw new Error(`Unexpected external module link: ${entry.name}`);
            }
            fs.unlinkSync(link);
            fs.symlinkSync(path.relative(path.dirname(link), target), link);
          }
          NODE
          tar --exclude='.next/cache' --exclude='.next/standalone' -czf production-artifact/next-build.tar.gz .next
          cd production-artifact
          sha256sum next-build.tar.gz > next-build.sha256
      - name: Upload verified production build
        if: success() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: production-next-a3cbf09
          path: production-artifact/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-persistence-evidence
          path: artifacts/
          retention-days: 7
