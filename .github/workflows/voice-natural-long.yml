name: Natural long bilingual acceptance study
on:
  push:
    branches: [experiment/voice-natural-long]
  workflow_dispatch:
    inputs:
      collect_audio_and_infer:
        description: Download public audio and run three models (otherwise tests/report only)
        type: boolean
        default: false
      evidence_run:
        description: Completed comparison run to analyze without rerunning models
        type: string
        default: '35731913423'
permissions:
  contents: read
  actions: read
jobs:
  selection-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install opencc-python-reimplemented==0.1.7
      - run: python -m unittest discover -s scripts -p 'test_voice_*selection.py' -v
      - run: python -m unittest discover -s scripts -p test_voice_public_windows.py -v
      - run: python -m unittest discover -s scripts -p test_voice_long_report.py -v
  inventory:
    if: github.event_name == 'workflow_dispatch' && inputs.collect_audio_and_infer
    needs: selection-tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 pyarrow==20.0.0 soundfile==0.13.1 opencc-python-reimplemented==0.1.7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python scripts/voice_public_long_samples.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-long-inventory-${{ github.sha }}
          path: artifacts/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: voice-long-public-clips-${{ github.sha }}
          path: accuracy-samples/
          retention-days: 14
  report:
    needs: selection-tests
    if: github.event_name == 'push' || !inputs.collect_audio_and_infer
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.evidence_run || '35731913423' }}
          pattern: voice-long-performance-*
          merge-multiple: true
          path: evidence
      - run: python scripts/voice_long_report.py evidence report
        env:
          EVIDENCE_RUN: ${{ inputs.evidence_run || '35731913423' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-long-reviewed-performance-${{ github.sha }}
          path: report/
          retention-days: 14
  compare:
    needs: inventory
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: voice-long-public-clips-${{ github.sha }}
          path: accuracy-samples
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35619891005
          name: voice-quantized-models-5f466642d9c831fb531a949b60862f224ad2a1b8
          path: quantized
      - name: Prepare pinned models and runtime
        run: |
          echo '258f71d72806834e0b1df98a0e6025d5c4cba1464ac4da9ad26e767ed4e555d8  quantized/u8u8/llm.int8.onnx' | sha256sum --check
          echo 'b428cd7d87593b29af27077a5a7f758e4475c4e20856a7f7a64cb08cd9a2aa2c  quantized/encoder/encoder_adaptor.int8.onnx' | sha256sum --check
          mkdir sherpa sense original float
          curl -fL --retry 3 --max-time 240 https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-linux-x64-shared-no-tts.tar.bz2 -o runtime.tar.bz2
          echo 'd0f96c8b65c6cd0974fada22737e337de81bc8cd2abbec2e39caf358b1eec5fc  runtime.tar.bz2' | sha256sum --check
          tar -xjf runtime.tar.bz2 --strip-components=1 -C sherpa
          curl -fL --retry 3 --max-time 600 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-funasr-nano-int8-2025-12-30.tar.bz2 -o original.tar.bz2
          echo 'eb43d7ccc2e86b243f6a03b7df361033dda66db9523d1a92bf6aca2b50c9476b  original.tar.bz2' | sha256sum --check
          tar -xjf original.tar.bz2 --strip-components=1 -C original
          curl -fL --retry 3 --max-time 600 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-funasr-nano-2025-12-30.tar.bz2 -o float.tar.bz2
          echo '92ac72f74ce5e621564f7693de5d383fa11b1ad836fc0bbfc14ed7cb4cc68509  float.tar.bz2' | sha256sum --check
          tar -xjf float.tar.bz2 --strip-components=1 -C float
          curl -fL --retry 3 --max-time 600 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17.tar.bz2 -o sense.tar.bz2
          echo '7d1efa2138a65b0b488df37f8b89e3d91a60676e416f515b952358d83dfd347e  sense.tar.bz2' | sha256sum --check
          tar -xjf sense.tar.bz2 --strip-components=1 -C sense
          mkdir artifacts
          sha256sum runtime.tar.bz2 original.tar.bz2 float.tar.bz2 sense.tar.bz2 > artifacts/source-archives.sha256
          cp sense/LICENSE artifacts/sense-model-LICENSE
      - name: Run sequential same-host performance comparisons
        run: |
          failed=0
          for variant in sense float-encoder safe-encoder; do
            mkdir -p "case-$variant/model" "case-$variant/artifacts"
            ln -s ../accuracy-samples "case-$variant/accuracy-samples"
            ln -s ../sherpa "case-$variant/sherpa"
            ln -s ../scripts "case-$variant/scripts"
            if [ "$variant" = sense ]; then
              ln -s ../../sense/model.int8.onnx "case-$variant/model/model.int8.onnx"
              ln -s ../../sense/tokens.txt "case-$variant/model/tokens.txt"
            else
              ln -s ../../original/embedding.int8.onnx "case-$variant/model/embedding.int8.onnx"
              ln -s ../../original/Qwen3-0.6B "case-$variant/model/Qwen3-0.6B"
              ln -s ../../quantized/u8u8/llm.int8.onnx "case-$variant/model/llm.int8.onnx"
              if [ "$variant" = float-encoder ]; then
                ln -s ../../float/encoder_adaptor.onnx "case-$variant/model/encoder_adaptor.int8.onnx"
              else
                ln -s ../../quantized/encoder/encoder_adaptor.int8.onnx "case-$variant/model/encoder_adaptor.int8.onnx"
              fi
            fi
            if ! docker run --rm --memory=4g --memory-swap=4g --cpus=2 --pids-limit=128 \
              -e GITHUB_SHA -e VARIANT="$variant" -e OPENBLAS_NUM_THREADS=2 -e OMP_NUM_THREADS=2 \
              -v "$PWD:/work" -w "/work/case-$variant" python:3.12-bookworm bash -euc '
                apt-get update -qq
                apt-get install -y -qq time libsndfile1
                pip install --quiet numpy==2.2.6 pyarrow==20.0.0 soundfile==0.13.1 opencc-python-reimplemented==0.1.7
                export LD_LIBRARY_PATH=/work/sherpa/lib
                ulimit -c 0
                python scripts/voice_long_performance.py "$VARIANT"
              '; then
              echo "::error::Candidate execution failed for $variant; preserving evidence"
              failed=1
            fi
          done
          exit "$failed"
      - name: Report context warnings separately from process exit status
        if: always()
        run: python3 scripts/voice_long_report.py . report
        env:
          EVIDENCE_RUN: ${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-long-performance-${{ github.sha }}
          path: |
            artifacts/
            case-*/artifacts/
            report/
          retention-days: 14
