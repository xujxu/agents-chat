name: CPU voice server resource profiles
on:
  push:
    branches: [experiment/voice-natural-long]
    paths:
      - scripts/voice_server_profiles.py
      - scripts/test_voice_server_profiles.py
      - .github/workflows/voice-server-profiles.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install opencc-python-reimplemented==0.1.7
      - run: python -m unittest discover -s scripts -p test_voice_server_profiles.py -v
