name: Checks

# Fast required check: runs on every pull request (no path filter). Browser tests live in playwright.yml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit --incremental false
      - name: Unit tests
        shell: bash
        run: |
          js=(); ts=()
          for f in tests/*.test.mjs tests/*.test.js tests/*.test.ts; do
            if [[ "$f" == *.ts ]]; then ts+=("$f"); else js+=("$f"); fi
          done
          node --test "${js[@]}"
          npx --yes --package=tsx@4.20.6 tsx --test "${ts[@]}"