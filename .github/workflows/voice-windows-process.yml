name: Voice Windows process foundation
on:
  push:
    branches: [experiment/voice-natural-long]
    paths:
      - 'scripts/voice/windows/**'
      - 'lib/voice/**'
      - 'tests/voice-windows-runtime.test.ts'
      - 'tests/voice-windows-job.test.mjs'
      - 'tests/fixtures/voice-windows-*'
      - '.github/workflows/voice-windows-process.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Compile native launcher and policy fixture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .data/voice-windows-build | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC x64 build tools missing' }
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $job = 'cl /nologo /Bv /W4 /WX /EHsc /std:c++17 /MT /DUNICODE /D_UNICODE scripts\voice\windows\voice-job.cpp /Fo.data\voice-windows-build\voice-job.obj /Fe.data\voice-windows-build\voice-job.exe'
          $fixture = 'cl /nologo /W4 /WX /EHsc /std:c++17 /MT /DUNICODE /D_UNICODE tests\fixtures\voice-windows-policy.cpp /Fo.data\voice-windows-build\voice-policy.obj /Fe.data\voice-windows-build\voice-policy.exe'
          $provider = 'cl /nologo /W4 /WX /EHsc /std:c++17 /MT /DUNICODE /D_UNICODE tests\fixtures\voice-windows-provider.cpp /Fo.data\voice-windows-build\voice-provider.obj /Fe.data\voice-windows-build\voice-provider.exe'
          cmd /d /s /c "`"$devcmd`" -arch=x64 -host_arch=x64 && $job && $fixture && $provider"
          if ($LASTEXITCODE -ne 0) { throw 'Native compilation failed' }
          $os = Get-CimInstance Win32_OperatingSystem
          @{
            commit = $env:GITHUB_SHA
            runnerOS = $os.Caption
            version = $os.Version
            architecture = $os.OSArchitecture
            node = (node --version)
            visualStudio = $vs
            qualification = 'process-foundation-only-not-model-or-win11-acceptance'
            binaries = @(Get-ChildItem .data/voice-windows-build/*.exe | ForEach-Object {
              @{ name = $_.Name; sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash; bytes = $_.Length }
            })
          } | ConvertTo-Json -Depth 4 | Set-Content .data/voice-windows-build/provenance.json -Encoding utf8
      - name: Exercise owned process trees
        shell: pwsh
        run: node --test --test-concurrency=1 tests/voice-windows-job.test.mjs
      - run: npm ci --no-audit --no-fund
      - name: Exercise Windows runtime contracts
        run: npx --yes --package=tsx@4.20.6 tsx --test --test-concurrency=1 tests/voice-windows-runtime.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-windows-process-${{ github.sha }}
          path: |
            .data/voice-windows-build/*.exe
            .data/voice-windows-build/provenance.json
          if-no-files-found: ignore
          retention-days: 14
