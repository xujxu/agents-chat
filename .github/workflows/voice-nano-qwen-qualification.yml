name: Nano and Qwen full CPU qualification
on:
  push:
    branches: [experiment/voice-natural-long]
    paths:
      - .github/workflows/voice-nano-qwen-qualification.yml
      - scripts/voice_model_stability.py
      - scripts/test_voice_model_stability.py
      - scripts/test_voice_model_notices.py
      - scripts/voice_model_notices.py
  workflow_dispatch:
    inputs:
      evidence_run:
        description: Completed inference run to inspect notices only; blank runs inference
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install opencc-python-reimplemented==0.1.7
      - run: python -m unittest discover -s scripts -p test_voice_model_stability.py -v
      - run: python -m unittest discover -s scripts -p test_voice_model_notices.py -v
      - run: python -m unittest discover -s scripts -p test_voice_server_profiles.py -v
      - run: python -m unittest discover -s scripts -p test_voice_choice.py -v
      - run: python -m unittest discover -s scripts -p test_voice_corpus_baseline.py -v
  qualify:
    if: github.event_name == 'workflow_dispatch' && inputs.evidence_run == ''
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install opencc-python-reimplemented==0.1.7
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35858271102
          artifact-ids: 10748244312
          merge-multiple: true
          path: short
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35863991538
          artifact-ids: 10752270787
          merge-multiple: true
          path: meeting
      - run: python scripts/voice_chain_report.py prepare short meeting corpus
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35858271102
          artifact-ids: 10751002303
          merge-multiple: true
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35870441019
          artifact-ids: 10755950119
          merge-multiple: true
          path: long-baseline
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35619891005
          artifact-ids: 10650339950
          merge-multiple: true
          path: quantized
      - name: Exact native runtime and unchanged quantized weights
        run: |
          echo '258f71d72806834e0b1df98a0e6025d5c4cba1464ac4da9ad26e767ed4e555d8  quantized/u8u8/llm.int8.onnx' | sha256sum --check
          echo 'b428cd7d87593b29af27077a5a7f758e4475c4e20856a7f7a64cb08cd9a2aa2c  quantized/encoder/encoder_adaptor.int8.onnx' | sha256sum --check
          mkdir sherpa original qwen provenance
          curl -fL --retry 3 --max-time 240 https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-linux-x64-shared-no-tts.tar.bz2 -o runtime.tar.bz2
          echo 'd0f96c8b65c6cd0974fada22737e337de81bc8cd2abbec2e39caf358b1eec5fc  runtime.tar.bz2' | sha256sum --check
          tar -xjf runtime.tar.bz2 --strip-components=1 -C sherpa
          curl -fL --retry 3 --max-time 600 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-funasr-nano-int8-2025-12-30.tar.bz2 -o original.tar.bz2
          echo 'eb43d7ccc2e86b243f6a03b7df361033dda66db9523d1a92bf6aca2b50c9476b  original.tar.bz2' | sha256sum --check
          tar -xjf original.tar.bz2 --strip-components=1 -C original
          curl -fL --retry 3 --max-time 600 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-qwen3-asr-0.6B-int8-2026-03-25.tar.bz2 -o qwen.tar.bz2
          echo '393f8a14e2f5fb96746aaab342997a40641001fbd5bf9592a080a8329178ee96  qwen.tar.bz2' | sha256sum --check
          tar -xjf qwen.tar.bz2 --strip-components=1 -C qwen
          sha256sum runtime.tar.bz2 original.tar.bz2 qwen.tar.bz2 sherpa/bin/sherpa-onnx-offline \
            quantized/u8u8/llm.int8.onnx quantized/encoder/encoder_adaptor.int8.onnx > provenance/checksums.txt
          find original qwen -type f ! -path '*/test_wavs/*' -exec sha256sum '{}' + > provenance/model-files.sha256
          find original qwen sherpa -maxdepth 3 -type f \( -iname '*license*' -o -iname '*notice*' -o -iname 'readme*' \) \
            ! -path '*/test_wavs/*' -exec cp --parents '{}' provenance/ \;
          curl -fL --retry 3 https://huggingface.co/FunAudioLLM/Fun-ASR-Nano-2512/raw/272c57b82523ada6fd87095e955f8e29100979ab/README.md -o provenance/nano-model-card.txt
          curl -fL --retry 3 https://huggingface.co/Qwen/Qwen3-ASR-0.6B/raw/5eb144179a02acc5e5ba31e748d22b0cf3e303b0/README.md -o provenance/qwen-model-card.txt
          curl -fL --retry 3 https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/v1.13.8/LICENSE -o provenance/sherpa-Apache-2.0.txt
          curl -fL --retry 3 https://raw.githubusercontent.com/Wasser1462/FunASR-nano-onnx/6823a8ed9f4a0393750d54d750051cf5a51a7fa9/README.md -o provenance/nano-conversion-readme.txt
          curl -fL --retry 3 https://raw.githubusercontent.com/Wasser1462/Qwen3-ASR-onnx/0829a577ee741e408e65763dfe01ff4fe75408e9/README.md -o provenance/qwen-conversion-readme.txt
          curl -fL --retry 3 https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/v1.13.8/cmake/onnxruntime-linux-x86_64.cmake -o provenance/onnxruntime-build-source.txt
          lscpu > provenance/cpu.txt
          LD_LIBRARY_PATH="$PWD/sherpa/lib" ldd sherpa/bin/sherpa-onnx-offline > provenance/native-linked-libraries.txt
          ls -l sherpa/lib > provenance/runtime-library-files.txt
          cp scripts/VOICE-DEPLOYMENT.txt provenance/
      - name: Prepare isolated measurement image
        run: |
          docker build -t voice-nano-qwen - <<'DOCKER'
          FROM python:3.12-bookworm
          RUN apt-get update -qq && apt-get install -y -qq time && \
              pip install --quiet opencc-python-reimplemented==0.1.7
          DOCKER
          docker image inspect voice-nano-qwen > provenance/container-image.json
      - name: Full100 then English repeats, both budgets on one host
        run: |
          failed=0
          for profile in cpu2-ram4 cpu4-ram8; do
            case "$profile" in cpu2-ram4) threads=2; memory=4g ;; cpu4-ram8) threads=4; memory=8g ;; esac
            mkdir "$profile"
            ln -s ../corpus "$profile/corpus"
            for variant in funasr-u8u8 qwen-int8; do
              folder="$profile/case-$variant"
              mkdir -p "$folder/model"
              ln -s ../../scripts "$folder/scripts"
              ln -s ../../sherpa "$folder/sherpa"
              ln -s ../../corpus/audio "$folder/accuracy-samples"
              if [ "$variant" = funasr-u8u8 ]; then
                ln -s ../../../original/embedding.int8.onnx "$folder/model/embedding.int8.onnx"
                ln -s ../../../original/Qwen3-0.6B "$folder/model/Qwen3-0.6B"
                ln -s ../../../quantized/u8u8/llm.int8.onnx "$folder/model/llm.int8.onnx"
                ln -s ../../../quantized/encoder/encoder_adaptor.int8.onnx "$folder/model/encoder_adaptor.int8.onnx"
              else
                for name in conv_frontend.onnx encoder.int8.onnx decoder.int8.onnx tokenizer; do
                  ln -s "../../../qwen/$name" "$folder/model/$name"
                done
              fi
              if ! docker run --rm --network=none --memory="$memory" --memory-swap="$memory" \
                --cpus="$threads" --pids-limit=128 -e GITHUB_SHA -e GITHUB_RUN_ID \
                -e OPENBLAS_NUM_THREADS="$threads" -e OMP_NUM_THREADS="$threads" \
                -e LD_LIBRARY_PATH=/work/sherpa/lib -v "$PWD:/work" -w "/work/$folder" \
                voice-nano-qwen python scripts/voice_server_profiles.py run "$variant" "$profile" fixed100; then
                echo "::error::Incomplete $variant/$profile, preserving evidence"
                failed=1
              fi
            done
            for repeat in 1 2; do
              folder="$profile/repeat-$repeat/case-qwen-int8"
              mkdir -p "$folder"
              ln -s ../../corpus "$profile/repeat-$repeat/corpus"
              ln -s ../../../scripts "$folder/scripts"
              ln -s ../../../sherpa "$folder/sherpa"
              ln -s ../../../qwen "$folder/model"
              ln -s ../../../corpus/audio "$folder/accuracy-samples"
              if ! docker run --rm --network=none --memory="$memory" --memory-swap="$memory" \
                --cpus="$threads" --pids-limit=128 -e GITHUB_SHA -e GITHUB_RUN_ID \
                -e OPENBLAS_NUM_THREADS="$threads" -e OMP_NUM_THREADS="$threads" \
                -e LD_LIBRARY_PATH=/work/sherpa/lib -v "$PWD:/work" -w "/work/$folder" \
                voice-nano-qwen python scripts/voice_server_profiles.py run qwen-int8 "$profile" english6; then
                echo "::error::Incomplete Qwen stability repeat$repeat/$profile"
                failed=1
              fi
            done
          done
          exit "$failed"
      - name: Frozen quality gates and all-repeat stability report
        run: |
          for profile in cpu2-ram4 cpu4-ram8; do
            (cd "$profile" && python ../scripts/voice_server_profiles.py report "$profile" report nano-qwen fixed100)
            python scripts/voice_server_profiles.py gates "$profile" nano-qwen
            cat "$profile/report/REPORT.md" >> "$GITHUB_STEP_SUMMARY"
          done
          python scripts/voice_model_stability.py .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-nano-qwen-qualification
          path: |
            cpu2-ram4/case-*/artifacts/
            cpu4-ram8/case-*/artifacts/
            cpu2-ram4/repeat-*/case-*/artifacts/
            cpu4-ram8/repeat-*/case-*/artifacts/
            cpu2-ram4/report/
            cpu4-ram8/report/
            stability/
            provenance/
            corpus/*ATTRIBUTION.txt
          if-no-files-found: error
          retention-days: 30
  notices:
    if: github.event_name == 'workflow_dispatch' && inputs.evidence_run != ''
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.evidence_run }}
          name: voice-nano-qwen-qualification
          path: evidence
      - run: python scripts/voice_model_notices.py evidence notices
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-nano-qwen-notices
          path: notices/
          if-no-files-found: error
          retention-days: 30
