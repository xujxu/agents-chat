name: Controlled voice audio graph
on:
  push:
    branches: [experiment/voice-natural-long]
    paths:
      - 'scripts/voice_graph_*.py'
      - 'scripts/test_voice_graph_*.py'
      - 'tests/helpers/voiceGraph*.ts'
      - 'tests/voice-audio-graph.spec.ts'
      - 'tests/playwright.voice-graph.config.ts'
      - '.github/workflows/voice-audio-graph.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6
      - run: python -m unittest discover -s scripts -p 'test_voice_graph_*.py' -v
