name: Controlled voice audio graph
on:
  push:
    branches: [experiment/voice-natural-long]
    paths:
      - 'scripts/voice_graph_*.py'
      - 'scripts/test_voice_graph_*.py'
      - 'tests/helpers/voiceGraph*.ts'
      - 'tests/voice-audio-graph.spec.ts'
      - 'tests/playwright.voice-graph.config.ts'
      - '.github/workflows/voice-audio-graph.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 opencc-python-reimplemented==0.1.7
      - run: python -m unittest discover -s scripts -p 'test_voice_graph_*.py' -v
      - run: python -m unittest discover -s scripts -p 'test_voice_signal_*.py' -v
  browser:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      NEXTAUTH_SECRET: isolated-graph-fixture-secret
      NEXTAUTH_URL: http://localhost:3011
      PLAYWRIGHT_BASE_URL: http://localhost:3011
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit --strict --skipLibCheck --esModuleInterop --target ES2017 --lib dom,dom.iterable,esnext --module esnext --moduleResolution bundler --jsx react-jsx tests/playwright.voice-graph.config.ts tests/voice-audio-graph.spec.ts
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npx tsc --noEmit --incremental false
      - name: Browser contracts and existing voice regressions
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3011 > graph-private-server.log 2>&1 &
          app=$!
          trap 'kill "$app"; wait "$app" || true' EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent --max-time 2 http://localhost:3011/api/auth/providers >/dev/null; then ready=1; break; fi
            if ! kill -0 "$app" 2>/dev/null; then echo 'Fixture server exited'; exit 1; fi
            sleep 1
          done
          test "$ready" = 1
          npx playwright test --config tests/playwright.voice-graph.config.ts --grep-invert 'graph measurement:' --reporter=line --trace=off --global-timeout=600000
          python scripts/voice_graph_report.py graph-contract-evidence graph-contract-report --contracts
      - name: Fixed 36 recording schedule
        id: measure
        if: github.event_name == 'workflow_dispatch'
        env:
          VOICE_GRAPH_MEASURE: '1'
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3011 > graph-private-server.log 2>&1 &
          app=$!
          trap 'kill "$app"; wait "$app" || true' EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent --max-time 2 http://localhost:3011/api/auth/providers >/dev/null; then ready=1; break; fi
            if ! kill -0 "$app" 2>/dev/null; then echo 'Fixture server exited'; exit 1; fi
            sleep 1
          done
          test "$ready" = 1
          npx playwright test --config tests/playwright.voice-graph.config.ts --grep 'graph measurement:' --reporter=line --trace=off --global-timeout=900000
      - name: Analyze every attempted recording
        if: ${{ always() && steps.measure.outcome != 'skipped' && steps.measure.outcome != '' }}
        run: python scripts/voice_graph_report.py graph-evidence graph-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graph-contract-evidence
          path: |
            graph-contract-evidence/
            graph-contract-report/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.measure.outcome != 'skipped' && steps.measure.outcome != '' }}
        with:
          name: graph-evidence
          path: graph-evidence/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.measure.outcome != 'skipped' && steps.measure.outcome != '' }}
        with:
          name: graph-report
          path: graph-report/
          if-no-files-found: error
          retention-days: 30
