name: FunASR CPU quantization compatibility
on:
  push:
    branches: [experiment/voice-quantization]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conversion-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 onnx==1.19.0 onnxruntime==1.23.2
      - run: python -m unittest discover -s scripts -p test_voice_funasr_quantize.py -v
