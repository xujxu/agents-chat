name: Teams bot

# Runs on every pull request (no path filter) so it can be a required status check.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teams-bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  teams-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit --incremental false
      - name: Teams helper tests
        run: node --test tests/teams-bot-util.test.mjs
      - name: Teams inbound token validation tests (issuer, audience, signing key, service URL)
        run: npx --yes --package=tsx@4.20.6 tsx --test tests/teams-bot-auth.test.ts
      - name: Teams bridge tests (group chat gating, per-user state, 1:1 behavior)
        run: npx --yes --package=tsx@4.20.6 tsx --test tests/teams-bot-bridge.test.ts
      - name: ACP session model tests (agent default and selected model are applied)
        run: npx --yes --package=tsx@4.20.6 tsx --test tests/acp-session-model.test.ts
