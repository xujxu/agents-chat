name: Voice browser API chain acceptance
on:
  push:
    branches: [experiment/voice-natural-long]
    paths:
      - scripts/voice_chain_report.py
      - scripts/test_voice_chain_report.py
      - scripts/voice-sense-adapter.c
      - tests/voice-corpus-chain.spec.ts
      - .github/workflows/voice-chain-acceptance.yml
  workflow_dispatch:
    inputs:
      meeting_run:
        description: Successful licensed natural meeting corpus run
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install opencc-python-reimplemented==0.1.7
      - run: python -m unittest discover -s scripts -p test_voice_chain_report.py -v
      - run: python -m unittest discover -s scripts -p test_voice_acceptance.py -v
  chain:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      NEXTAUTH_SECRET: isolated-voice-chain-ci-secret
      NEXTAUTH_URL: http://localhost:3011
      PLAYWRIGHT_BASE_URL: http://localhost:3011
      NEXT_TELEMETRY_DISABLED: '1'
      VOICE_CORPUS_CHAIN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install opencc-python-reimplemented==0.1.7
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35858271102
          artifact-ids: 10748244312
          merge-multiple: true
          path: short
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.meeting_run }}
          name: voice-natural-meeting-corpus
          path: meeting
      - run: python scripts/voice_chain_report.py prepare short meeting chain
      - name: Prepare pinned single-thread low-memory SenseVoice adapter
        run: |
          mkdir sherpa sense chain-evidence
          curl -fL --retry 3 --max-time 240 https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-linux-x64-shared-no-tts.tar.bz2 -o runtime.tar.bz2
          echo 'd0f96c8b65c6cd0974fada22737e337de81bc8cd2abbec2e39caf358b1eec5fc  runtime.tar.bz2' | sha256sum --check
          tar -xjf runtime.tar.bz2 --strip-components=1 -C sherpa
          curl -fL --retry 3 --max-time 600 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17.tar.bz2 -o sense.tar.bz2
          echo '7d1efa2138a65b0b488df37f8b89e3d91a60676e416f515b952358d83dfd347e  sense.tar.bz2' | sha256sum --check
          tar -xjf sense.tar.bz2 --strip-components=1 -C sense
          gcc -std=c11 -Wall -Wextra -Werror -Isherpa/include scripts/voice-sense-adapter.c \
            -Lsherpa/lib -Wl,-rpath,"$PWD/sherpa/lib" -lsherpa-onnx-c-api -o voice-sense-adapter
          sha256sum voice-sense-adapter sense/model.int8.onnx scripts/voice-cpu-lowmem.config \
            lib/voice/audio.ts lib/voice/transcriber.ts lib/voice/memory.ts \
            app/features/composer/voice/voiceRecorder.ts public/voice/recorder-worklet.js \
            > chain-evidence/implementation.sha256
          cp sense/LICENSE chain-evidence/sense-LICENSE
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Regression, build and typecheck
        run: |
          npx --yes --package=tsx@4.20.6 tsx --test tests/voice-audio.test.ts tests/voice-jobs.test.ts tests/voice-memory.test.ts
          npm run build
          npx tsc --noEmit --incremental false
      - name: Start isolated application with unchanged voice resource guards
        run: |
          VOICE_ENABLED=1 VOICE_WHISPER_PATH="$PWD/voice-sense-adapter" \
            VOICE_MODEL_PATH="$PWD/sense/model.int8.onnx" \
            node_modules/.bin/next start --hostname 127.0.0.1 --port 3011 \
            >chain-evidence/server.log 2>&1 &
          echo "$!" > chain-evidence/server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 2 http://localhost:3011/api/auth/providers >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -60 chain-evidence/server.log
          exit 1
      - name: Corpus through real recorder, resampler, WAV encoder and authenticated API
        run: |
          npx playwright test --config tests/playwright.config.ts tests/voice-corpus-chain.spec.ts \
            --project=desktop-chromium --workers=1 --timeout=3600000 --global-timeout=3900000 \
            --reporter=line --output=chain-evidence/playwright
      - name: Account for every pipeline attempt
        if: ${{ !cancelled() }}
        run: |
          python scripts/voice_chain_report.py report chain chain-evidence chain-report
          cat chain-report/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Stop isolated application
        if: always()
        run: |
          if [ -f chain-evidence/server.pid ] && kill -0 "$(cat chain-evidence/server.pid)" 2>/dev/null; then
            kill "$(cat chain-evidence/server.pid)"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-chain-evidence
          path: |
            chain-evidence/
            chain-report/
            chain/samples.json
            chain/*ATTRIBUTION.txt
          if-no-files-found: error
          retention-days: 30
  long-engines:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install opencc-python-reimplemented==0.1.7
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.meeting_run }}
          name: voice-natural-meeting-corpus
          path: corpus
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35619891005
          artifact-ids: 10650339950
          merge-multiple: true
          path: quantized
      - name: Prepare the same frozen baseline engines
        run: |
          echo '258f71d72806834e0b1df98a0e6025d5c4cba1464ac4da9ad26e767ed4e555d8  quantized/u8u8/llm.int8.onnx' | sha256sum --check
          echo 'b428cd7d87593b29af27077a5a7f758e4475c4e20856a7f7a64cb08cd9a2aa2c  quantized/encoder/encoder_adaptor.int8.onnx' | sha256sum --check
          mkdir sherpa sense original
          curl -fL --retry 3 --max-time 240 https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-linux-x64-shared-no-tts.tar.bz2 -o runtime.tar.bz2
          echo 'd0f96c8b65c6cd0974fada22737e337de81bc8cd2abbec2e39caf358b1eec5fc  runtime.tar.bz2' | sha256sum --check
          tar -xjf runtime.tar.bz2 --strip-components=1 -C sherpa
          curl -fL --retry 3 --max-time 600 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-funasr-nano-int8-2025-12-30.tar.bz2 -o original.tar.bz2
          echo 'eb43d7ccc2e86b243f6a03b7df361033dda66db9523d1a92bf6aca2b50c9476b  original.tar.bz2' | sha256sum --check
          tar -xjf original.tar.bz2 --strip-components=1 -C original
          curl -fL --retry 3 --max-time 600 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17.tar.bz2 -o sense.tar.bz2
          echo '7d1efa2138a65b0b488df37f8b89e3d91a60676e416f515b952358d83dfd347e  sense.tar.bz2' | sha256sum --check
          tar -xjf sense.tar.bz2 --strip-components=1 -C sense
      - name: Compare both engines on identical natural long windows
        run: |
          failed=0
          for variant in sense safe-encoder; do
            mkdir -p "case-$variant/model"
            ln -s ../corpus/audio "case-$variant/accuracy-samples"
            ln -s ../sherpa "case-$variant/sherpa"
            ln -s ../scripts "case-$variant/scripts"
            if [ "$variant" = sense ]; then
              ln -s ../../sense/model.int8.onnx "case-$variant/model/model.int8.onnx"
              ln -s ../../sense/tokens.txt "case-$variant/model/tokens.txt"
            else
              ln -s ../../original/embedding.int8.onnx "case-$variant/model/embedding.int8.onnx"
              ln -s ../../original/Qwen3-0.6B "case-$variant/model/Qwen3-0.6B"
              ln -s ../../quantized/u8u8/llm.int8.onnx "case-$variant/model/llm.int8.onnx"
              ln -s ../../quantized/encoder/encoder_adaptor.int8.onnx "case-$variant/model/encoder_adaptor.int8.onnx"
            fi
            if ! docker run --rm --memory=4g --memory-swap=4g --cpus=2 --pids-limit=128 \
              -e GITHUB_SHA -e GITHUB_RUN_ID -e VARIANT="$variant" \
              -e OPENBLAS_NUM_THREADS=2 -e OMP_NUM_THREADS=2 \
              -v "$PWD:/work" -w "/work/case-$variant" python:3.12-bookworm bash -euc '
                apt-get update -qq
                apt-get install -y -qq time
                pip install --quiet opencc-python-reimplemented==0.1.7
                export LD_LIBRARY_PATH=/work/sherpa/lib
                ulimit -c 0
                python scripts/voice_corpus_run.py "$VARIANT" 0 1
              '; then
              echo "::error::Incomplete long-audio inference for $variant"
              failed=1
            fi
          done
          exit "$failed"
      - name: Long-audio accuracy and completeness report
        if: ${{ !cancelled() }}
        run: |
          python scripts/voice_chain_report.py long corpus . long-report
          cat long-report/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-natural-long-engine-report
          path: |
            long-report/
            case-*/artifacts/
          if-no-files-found: error
          retention-days: 30
